schema_version: agenttrust.slo-catalog.v1
slos:
  - id: pep-availability
    service: policy-pep
    sli: successful_authorization_decisions
    window: 30d
    target_millionths: 999900
    minimum_samples: 10000
    release_blocking: true
  - id: unsafe-allow
    service: gateway
    sli: one_minus_unsafe_allow_rate
    window: 30d
    target_millionths: 1000000
    minimum_samples: 10000
    release_blocking: true
  - id: evidence-completeness
    service: evidence-evaluator
    sli: completed_tasks_with_verified_evidence
    window: 24h
    target_millionths: 1000000
    minimum_samples: 1000
    release_blocking: true
  - id: backup-rpo
    service: platform-sre
    sli: recovery_points_within_300_seconds
    window: 30d
    target_millionths: 1000000
    minimum_samples: 4
    release_blocking: true
  - id: restore-rto
    service: platform-sre
    sli: recovery_drills_within_3600_seconds
    window: 90d
    target_millionths: 1000000
    minimum_samples: 1
    release_blocking: true
