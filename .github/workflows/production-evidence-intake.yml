name: production-evidence-intake

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed annotated tag that must peel to the protected default-branch SHA
        required: true
        type: string
      candidate_run_id:
        description: Successful production-release-candidate workflow run ID for this tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-evidence-intake
  cancel-in-progress: false

jobs:
  validate-and-seal-intake:
    runs-on: [self-hosted, linux, production-evidence, actions-runner-2-327-1]
    environment: production-evidence
    timeout-minutes: 90
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    env:
      AGENT_TRUST_GH_BINARY: ${{ vars.AGENT_TRUST_GH_BINARY }}
      AGENT_TRUST_GH_SHA256: ${{ vars.AGENT_TRUST_GH_SHA256 }}
      AGENT_TRUST_GIT_BINARY: ${{ vars.AGENT_TRUST_GIT_BINARY }}
      AGENT_TRUST_GIT_SHA256: ${{ vars.AGENT_TRUST_GIT_SHA256 }}
      AGENT_TRUST_DOCKER_BINARY: ${{ vars.AGENT_TRUST_DOCKER_BINARY }}
      AGENT_TRUST_DOCKER_SHA256: ${{ vars.AGENT_TRUST_DOCKER_SHA256 }}
      AGENT_TRUST_PYTHON_BINARY: ${{ vars.AGENT_TRUST_PYTHON_BINARY }}
      AGENT_TRUST_PYTHON_SHA256: ${{ vars.AGENT_TRUST_PYTHON_SHA256 }}
      AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_FILE: ${{ vars.AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_FILE }}
      AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_SHA256: ${{ vars.AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_SHA256 }}
      AGENT_TRUST_PYTHON_WHEELHOUSE_DIRECTORY: ${{ vars.AGENT_TRUST_PYTHON_WHEELHOUSE_DIRECTORY }}
      AGENT_TRUST_PYTHON_WHEELHOUSE_MANIFEST_SHA256: ${{ vars.AGENT_TRUST_PYTHON_WHEELHOUSE_MANIFEST_SHA256 }}
      AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE: ${{ vars.AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE }}
      AGENT_TRUST_QUALIFICATION_SOURCE_DIRECTORY: ${{ vars.AGENT_TRUST_QUALIFICATION_SOURCE_DIRECTORY }}
      AGENT_TRUST_GIT_PROVENANCE_KEYRING_FILE: ${{ vars.AGENT_TRUST_GIT_PROVENANCE_KEYRING_FILE }}
      AGENT_TRUST_RELEASE_BINDING_KEYRING_FILE: ${{ vars.AGENT_TRUST_RELEASE_BINDING_KEYRING_FILE }}
      AGENT_TRUST_REVIEWER_KEYRING_FILE: ${{ vars.AGENT_TRUST_REVIEWER_KEYRING_FILE }}
      AGENT_TRUST_WORM_KEYRING_FILE: ${{ vars.AGENT_TRUST_WORM_KEYRING_FILE }}
      AGENT_TRUST_REVOCATION_PUBLIC_KEY_FILE: ${{ vars.AGENT_TRUST_REVOCATION_PUBLIC_KEY_FILE }}
      AGENT_TRUST_REVOCATION_CHECKPOINT_FILE: ${{ vars.AGENT_TRUST_REVOCATION_CHECKPOINT_FILE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every ambient runner tool before use
        run: |
          set -euo pipefail
          "$AGENT_TRUST_PYTHON_BINARY" - <<'PY'
          import hashlib, os, pathlib, re, shutil, stat, sys
          if sys.version_info[:2] != (3, 14) or not pathlib.Path(sys.executable).is_absolute():
              raise SystemExit("RUNNER_PYTHON_VERSION_INVALID")
          for path_name, digest_name in (
              ("AGENT_TRUST_GH_BINARY", "AGENT_TRUST_GH_SHA256"),
              ("AGENT_TRUST_GIT_BINARY", "AGENT_TRUST_GIT_SHA256"),
              ("AGENT_TRUST_DOCKER_BINARY", "AGENT_TRUST_DOCKER_SHA256"),
              ("AGENT_TRUST_PYTHON_BINARY", "AGENT_TRUST_PYTHON_SHA256"),
          ):
              path = pathlib.Path(os.environ.get(path_name, ""))
              digest = os.environ.get(digest_name, "")
              if not path.is_absolute() or path.is_symlink() or path.resolve() != path:
                  raise SystemExit("RUNNER_TOOL_PATH_INVALID")
              metadata = path.stat(follow_symlinks=False)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_mode & 0o022 or os.access(path, os.W_OK) or not os.access(path, os.X_OK) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("RUNNER_TOOL_PATH_INVALID")
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit("RUNNER_TOOL_DIGEST_INVALID")
              resolved = shutil.which(path.name)
              if path_name != "AGENT_TRUST_PYTHON_BINARY" and resolved != str(path):
                  raise SystemExit("RUNNER_TOOL_RESOLUTION_INVALID")
          for path_name in (
              "AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE",
              "AGENT_TRUST_GIT_PROVENANCE_KEYRING_FILE",
              "AGENT_TRUST_RELEASE_BINDING_KEYRING_FILE",
              "AGENT_TRUST_REVIEWER_KEYRING_FILE",
              "AGENT_TRUST_WORM_KEYRING_FILE",
              "AGENT_TRUST_REVOCATION_PUBLIC_KEY_FILE",
              "AGENT_TRUST_REVOCATION_CHECKPOINT_FILE",
              "AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_FILE",
          ):
              path = pathlib.Path(os.environ.get(path_name, ""))
              if not path.is_absolute() or path.is_symlink() or path.resolve() != path:
                  raise SystemExit("RUNNER_TRUST_PATH_INVALID")
              metadata = path.stat(follow_symlinks=False)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_mode & 0o022 or not 1 <= metadata.st_size <= 64 * 1024 * 1024:
                  raise SystemExit("RUNNER_TRUST_PATH_INVALID")
              if not os.access(path, os.R_OK) or os.access(path, os.W_OK):
                  raise SystemExit("RUNNER_TRUST_PATH_ACCESS_INVALID")
          PY
          "$AGENT_TRUST_GH_BINARY" --version
          "$AGENT_TRUST_GH_BINARY" attestation verify --help | grep -F -- '--source-digest'
          "$AGENT_TRUST_GIT_BINARY" --version
          "$AGENT_TRUST_DOCKER_BINARY" version --format '{{.Client.Version}}'
      - id: source
        name: Verify the exact signed immutable source with deployment-owned Git trust
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_DISPATCH_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git_cmd=("$AGENT_TRUST_GIT_BINARY")
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          test "$GITHUB_REF" = "$EXPECTED_DISPATCH_REF"
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_PROTECTED" = true
          test "$AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE" != ""
          [[ "$AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE" = /* ]]
          test -f "$AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE"
          test ! -L "$AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE"
          tag_ref="refs/tags/$RELEASE_TAG"
          test "$("${git_cmd[@]}" cat-file -t "$tag_ref")" = tag
          "${git_cmd[@]}" -c include.path="$AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE" verify-tag "$tag_ref"
          commit_sha="$("${git_cmd[@]}" rev-parse "$tag_ref^{}")"
          test "$commit_sha" = "$GITHUB_SHA"
          "${git_cmd[@]}" -c include.path="$AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE" verify-commit "$commit_sha"
          "${git_cmd[@]}" checkout --detach "$commit_sha"
          test -z "$("${git_cmd[@]}" status --porcelain=v1 --untracked-files=all)"
          object_format="$("${git_cmd[@]}" rev-parse --show-object-format)"
          case "$object_format" in
            sha1) test "${#commit_sha}" -eq 40 ;;
            sha256) test "${#commit_sha}" -eq 64 ;;
            *) exit 1 ;;
          esac
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'release_id=git:%s:%s\n' "$object_format" "$commit_sha" >> "$GITHUB_OUTPUT"
      - name: Verify the digest-bound dependency closure and immutable Python runtime
        run: |
          set -euo pipefail
          "$AGENT_TRUST_PYTHON_BINARY" - <<'PY'
          import hashlib, json, os, pathlib, re, stat

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          wheelhouse = pathlib.Path(os.environ.get("AGENT_TRUST_PYTHON_WHEELHOUSE_DIRECTORY", ""))
          manifest_digest = os.environ.get("AGENT_TRUST_PYTHON_WHEELHOUSE_MANIFEST_SHA256", "")
          if not workspace.is_absolute() or workspace.resolve() != workspace:
              raise SystemExit("PYTHON_DEPENDENCY_WORKSPACE_INVALID")
          if not wheelhouse.is_absolute() or wheelhouse.is_symlink() or wheelhouse.resolve() != wheelhouse:
              raise SystemExit("PYTHON_WHEELHOUSE_INVALID")
          metadata = wheelhouse.stat(follow_symlinks=False)
          if not stat.S_ISDIR(metadata.st_mode) or metadata.st_mode & 0o022 or os.access(wheelhouse, os.W_OK):
              raise SystemExit("PYTHON_WHEELHOUSE_INVALID")

          def secure_file(path: pathlib.Path, maximum: int) -> bytes:
              metadata = path.stat(follow_symlinks=False)
              if path.is_symlink() or path.resolve().parent != wheelhouse or not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_mode & 0o022 or os.access(path, os.W_OK) or not 1 <= metadata.st_size <= maximum:
                  raise SystemExit("PYTHON_WHEELHOUSE_FILE_INVALID")
              return path.read_bytes()

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate JSON member")
                  value[key] = item
              return value

          manifest_path = wheelhouse / "wheelhouse-manifest.json"
          lock_path = wheelhouse / "requirements-ci.lock"
          manifest_bytes = secure_file(manifest_path, 16 * 1024 * 1024)
          lock_bytes = secure_file(lock_path, 16 * 1024 * 1024)
          if not re.fullmatch(r"[0-9a-f]{64}", manifest_digest) or hashlib.sha256(manifest_bytes).hexdigest() != manifest_digest:
              raise SystemExit("PYTHON_WHEELHOUSE_MANIFEST_DIGEST_INVALID")
          try:
              manifest = json.loads(manifest_bytes, object_pairs_hook=reject_duplicates)
              lock_text = lock_bytes.decode("utf-8")
          except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
              raise SystemExit("PYTHON_WHEELHOUSE_MANIFEST_INVALID") from error
          if not isinstance(manifest, dict) or set(manifest) != {"schema_version", "python_version", "requirements_sources", "requirements_lock_sha256", "wheels"} or manifest.get("schema_version") != "agenttrust.python-wheelhouse.v1" or manifest.get("python_version") != "3.14":
              raise SystemExit("PYTHON_WHEELHOUSE_MANIFEST_INVALID")

          discovered = set()
          pending = [workspace / "requirements-ci.txt"]
          while pending:
              source = pending.pop()
              if source in discovered:
                  continue
              if source.is_symlink() or source.resolve() != source or not source.is_file() or not source.is_relative_to(workspace):
                  raise SystemExit("PYTHON_REQUIREMENTS_SOURCE_INVALID")
              payload = source.read_bytes()
              if not 1 <= len(payload) <= 4 * 1024 * 1024:
                  raise SystemExit("PYTHON_REQUIREMENTS_SOURCE_INVALID")
              discovered.add(source)
              for line in payload.decode("utf-8").splitlines():
                  stripped = line.strip()
                  if not stripped.startswith(("-r", "--requirement")):
                      continue
                  match = re.fullmatch(r"(?:-r\s+|--requirement(?:\s+|=))([A-Za-z0-9_./-]{1,512})", stripped)
                  if match is None:
                      raise SystemExit("PYTHON_REQUIREMENTS_INCLUDE_INVALID")
                  included = source.parent / match.group(1)
                  if included.is_symlink() or included.resolve() != included or not included.is_relative_to(workspace):
                      raise SystemExit("PYTHON_REQUIREMENTS_INCLUDE_INVALID")
                  pending.append(included)
          expected_sources = [
              {"path": path.relative_to(workspace).as_posix(), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
              for path in sorted(discovered)
          ]
          if manifest.get("requirements_sources") != expected_sources or manifest.get("requirements_lock_sha256") != hashlib.sha256(lock_bytes).hexdigest():
              raise SystemExit("PYTHON_REQUIREMENTS_BINDING_INVALID")
          if "==" not in lock_text or "--hash=sha256:" not in lock_text or re.search(r"(?im)^\s*(?:-r|--requirement|-c|--constraint|-e|--editable|--index-url|--extra-index-url|--find-links|--trusted-host)\b", lock_text) or "://" in lock_text or " @ " in lock_text:
              raise SystemExit("PYTHON_REQUIREMENTS_LOCK_INVALID")
          hashes = re.findall(r"--hash=([^\s\\]+)", lock_text)
          if not hashes or any(not re.fullmatch(r"sha256:[0-9a-f]{64}", item) for item in hashes):
              raise SystemExit("PYTHON_REQUIREMENTS_LOCK_INVALID")

          wheels = manifest.get("wheels")
          if not isinstance(wheels, list) or not wheels:
              raise SystemExit("PYTHON_WHEELHOUSE_MANIFEST_INVALID")
          names = []
          for record in wheels:
              if not isinstance(record, dict) or set(record) != {"filename", "sha256", "size"}:
                  raise SystemExit("PYTHON_WHEELHOUSE_MANIFEST_INVALID")
              name, digest, size = record.get("filename"), record.get("sha256"), record.get("size")
              if not isinstance(name, str) or pathlib.Path(name).name != name or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,250}\.whl", name) or not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest) or not isinstance(size, int) or isinstance(size, bool) or not 1 <= size <= 1024 * 1024 * 1024:
                  raise SystemExit("PYTHON_WHEELHOUSE_MANIFEST_INVALID")
              payload = secure_file(wheelhouse / name, 1024 * 1024 * 1024)
              if len(payload) != size or hashlib.sha256(payload).hexdigest() != digest:
                  raise SystemExit("PYTHON_WHEEL_DIGEST_INVALID")
              names.append(name)
          if names != sorted(names) or len(names) != len(set(names)) or {item.name for item in wheelhouse.iterdir()} != {*names, manifest_path.name, lock_path.name}:
              raise SystemExit("PYTHON_WHEELHOUSE_CONTENT_INVALID")
          PY
          "$AGENT_TRUST_PYTHON_BINARY" scripts/verify-production-python-runtime.py verify \
            --manifest "$AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_FILE" \
            --manifest-sha256 "$AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_SHA256" \
            --python-sha256 "$AGENT_TRUST_PYTHON_SHA256" \
            --requirements-lock "$AGENT_TRUST_PYTHON_WHEELHOUSE_DIRECTORY/requirements-ci.lock"
          PIP_CONFIG_FILE=/dev/null "$AGENT_TRUST_PYTHON_BINARY" -m pip check
      - name: Verify the candidate workflow run identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          "$AGENT_TRUST_GH_BINARY" api "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            > "$RUNNER_TEMP/candidate-run.json"
          "$AGENT_TRUST_PYTHON_BINARY" - "$RUNNER_TEMP/candidate-run.json" <<'PY'
          import json, os, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "path": ".github/workflows/release-candidate.yml",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "head_sha": os.environ["COMMIT_SHA"],
              "head_branch": os.environ["DEFAULT_BRANCH"],
          }
          if any(value.get(key) != item for key, item in expected.items()):
              raise SystemExit("CANDIDATE_WORKFLOW_RUN_MISMATCH")
          PY
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-candidate-${{ steps.source.outputs.commit_sha }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify candidate manifest and every dynamically declared OCI subject attestation
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
          RELEASE_ID: ${{ steps.source.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/candidate/production-image-manifest.json"
          test -f "$manifest"
          test ! -L "$manifest"
          "$AGENT_TRUST_GH_BINARY" attestation verify "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-digest "$COMMIT_SHA" \
            --source-ref "$GITHUB_REF"
          "$AGENT_TRUST_PYTHON_BINARY" scripts/assemble-production-image-manifest.py verify \
            --manifest "$manifest" \
            --release-id "$RELEASE_ID" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"
          "$AGENT_TRUST_PYTHON_BINARY" - "$manifest" "$RUNNER_TEMP/candidate-images.txt" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          images = value.get("images")
          if not isinstance(images, dict) or not images:
              raise SystemExit("CANDIDATE_IMAGES_INVALID")
          pathlib.Path(sys.argv[2]).write_text(
              "".join(f"{image}\n" for _, image in sorted(images.items())),
              encoding="utf-8",
          )
          PY
          while IFS= read -r image; do
            test "$image" != ""
            "$AGENT_TRUST_GH_BINARY" attestation verify "oci://$image" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$COMMIT_SHA" \
              --source-ref "$GITHUB_REF"
          done < "$RUNNER_TEMP/candidate-images.txt"
      - id: intake
        name: Compile externally collected evidence and seal the bounded intake artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/production-qualification-source"
          mkdir -m 0700 "$output"
          "$AGENT_TRUST_PYTHON_BINARY" - "$output" "$RUNNER_TEMP/candidate/production-image-manifest.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import sys

          from python.production_gates.evidence_intake import validate_evidence_intake
          from python.production_gates.git_provenance import canonical_json
          from python.production_gates.qualification import QualificationTrustAnchors
          from python.production_gates.revocation_checkpoint import (
              read_checkpoint,
              verify_base_registry,
          )

          output = Path(sys.argv[1])
          candidate = Path(sys.argv[2])
          source = Path(os.environ.get("AGENT_TRUST_QUALIFICATION_SOURCE_DIRECTORY", ""))
          required = (
              "qualification-input.json",
              "production-runtime.json",
              "revocation-update.json",
          )
          optional = ("previous-revocation-registry.json",)

          def secure_path(path: Path, *, directory: bool = False, maximum: int = 64 << 20) -> None:
              if not path.is_absolute() or path.is_symlink() or path.resolve() != path:
                  raise SystemExit("EVIDENCE_INTAKE_PATH_INVALID")
              metadata = path.stat(follow_symlinks=False)
              expected = stat.S_ISDIR if directory else stat.S_ISREG
              if not expected(metadata.st_mode) or (not directory and metadata.st_nlink != 1):
                  raise SystemExit("EVIDENCE_INTAKE_PATH_INVALID")
              if metadata.st_mode & 0o022 or os.access(path, os.W_OK):
                  raise SystemExit("EVIDENCE_INTAKE_PATH_WRITABLE_BY_UNTRUSTED_PRINCIPAL")
              required_access = os.R_OK | (os.X_OK if directory else 0)
              if not os.access(path, required_access):
                  raise SystemExit("EVIDENCE_INTAKE_PATH_UNREADABLE")
              if not directory and not 1 <= metadata.st_size <= maximum:
                  raise SystemExit("EVIDENCE_INTAKE_PATH_INVALID")

          def read_json(path: Path, maximum: int = 64 << 20):
              secure_path(path, maximum=maximum)
              def reject_duplicates(pairs):
                  value = {}
                  for key, item in pairs:
                      if key in value:
                          raise ValueError("duplicate JSON member")
                      value[key] = item
                  return value
              try:
                  return json.loads(
                      path.read_text(encoding="utf-8"),
                      object_pairs_hook=reject_duplicates,
                  )
              except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as error:
                  raise SystemExit("EVIDENCE_INTAKE_JSON_INVALID") from error

          secure_path(source, directory=True)
          for name in required:
              secure_path(source / name)
          for name in optional:
              if (source / name).exists():
                  secure_path(source / name)

          anchors = QualificationTrustAnchors(
              git_provenance_keyring=read_json(
                  Path(os.environ["AGENT_TRUST_GIT_PROVENANCE_KEYRING_FILE"])
              ),
              release_binding_keyring=read_json(
                  Path(os.environ["AGENT_TRUST_RELEASE_BINDING_KEYRING_FILE"])
              ),
              reviewer_keyring=read_json(
                  Path(os.environ["AGENT_TRUST_REVIEWER_KEYRING_FILE"])
              ),
              worm_keyring=read_json(Path(os.environ["AGENT_TRUST_WORM_KEYRING_FILE"])),
          )
          qualification = read_json(source / "qualification-input.json")
          runtime = read_json(source / "production-runtime.json")
          revocation_update = read_json(source / "revocation-update.json")
          revocation_key = read_json(
              Path(os.environ["AGENT_TRUST_REVOCATION_PUBLIC_KEY_FILE"]), maximum=64 << 10
          )
          checkpoint = read_checkpoint(
              Path(os.environ["AGENT_TRUST_REVOCATION_CHECKPOINT_FILE"])
          )
          previous_registry = (
              read_json(source / "previous-revocation-registry.json")
              if (source / "previous-revocation-registry.json").exists()
              else None
          )
          verify_base_registry(checkpoint, previous_registry, revocation_key)
          if (
              checkpoint.get("registry_id") != revocation_update.get("registry_id")
              or checkpoint.get("key_id") != revocation_update.get("key_id")
          ):
              raise SystemExit("EVIDENCE_INTAKE_REVOCATION_CHECKPOINT_MISMATCH")
          closure_input, receipt = validate_evidence_intake(
              qualification,
              read_json(candidate),
              runtime,
              revocation_update,
              anchors,
              revocation_key,
              revocation_checkpoint=checkpoint,
              previous_revocation_registry=previous_registry,
              expected_release_tag=os.environ["RELEASE_TAG"],
              expected_repository=os.environ["GITHUB_REPOSITORY"],
          )

          def write_new(path: Path, value: object) -> None:
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(canonical_json(value) + b"\n")
                  stream.flush()
                  os.fsync(stream.fileno())

          for name in (*required, *optional):
              item = source / name
              if item.exists():
                  with item.open("rb") as input_stream, (output / name).open("xb") as target:
                      os.chmod(target.fileno(), 0o600)
                      shutil.copyfileobj(input_stream, target, length=1024 * 1024)
                      target.flush()
                      os.fsync(target.fileno())
          shutil.copyfile(candidate, output / "production-image-manifest.json")
          os.chmod(output / "production-image-manifest.json", 0o600)
          write_new(output / "closure-input.json", closure_input)
          write_new(output / "intake-receipt.json", receipt)
          write_new(output / "revocation-checkpoint.json", checkpoint)
          PY
          printf 'directory=%s\n' "$output" >> "$GITHUB_OUTPUT"
      - id: qualification-attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.intake.outputs.directory }}/qualification-input.json
      - id: receipt-attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.intake.outputs.directory }}/intake-receipt.json
      - id: checkpoint-attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.intake.outputs.directory }}/revocation-checkpoint.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-qualification-source-${{ steps.source.outputs.commit_sha }}
          path: ${{ steps.intake.outputs.directory }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
      - name: Record the external-evidence boundary
        run: |
          {
            printf 'Release: `%s`\n' '${{ steps.source.outputs.release_id }}'
            printf 'Candidate run: `%s`\n' '${{ inputs.candidate_run_id }}'
            printf 'Qualification attestation: %s\n' '${{ steps.qualification-attestation.outputs.attestation-url }}'
            printf 'Intake receipt attestation: %s\n' '${{ steps.receipt-attestation.outputs.attestation-url }}'
            printf 'Revocation checkpoint snapshot attestation: %s\n' '${{ steps.checkpoint-attestation.outputs.attestation-url }}'
            printf 'This workflow validated externally supplied evidence; it did not create probes, signatures, or approvals.\n'
          } >> "$GITHUB_STEP_SUMMARY"
