name: production-linux-isolation
on: {workflow_dispatch: {}}
permissions:
  contents: read

jobs:
  gvisor-cgroup-seccomp:
    runs-on: [self-hosted, linux, gvisor, cgroup-v2, actions-runner-2-327-1]
    env:
      AGENT_TRUST_ISOLATION_MODE: production
      AGENT_TRUST_LINUX_TEST_IMAGE: ${{ vars.AGENT_TRUST_LINUX_TEST_IMAGE }}
      AGENT_TRUST_ISOLATION_REPORT: evidence/linux-isolation-report.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: {toolchain: "1.89.0"}
      - run: test "$(uname -s)" = Linux && test -x "$(command -v runsc)" && test -f /sys/fs/cgroup/cgroup.controllers
      - run: cargo test --locked -p agent-trust-sandbox-runtime --all-targets
      - run: ./scripts/run-linux-isolation-gate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-isolation-evidence
          path: evidence/linux-isolation-report.json
          if-no-files-found: error
