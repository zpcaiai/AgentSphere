name: production-linux-isolation
on: {workflow_dispatch: {}}
permissions:
  contents: read

concurrency:
  group: production-linux-isolation
  cancel-in-progress: false

jobs:
  gvisor-cgroup-seccomp:
    runs-on:
      group: production-isolation
      labels: agenttrust-production-gvisor
    environment: production-linux-isolation
    env:
      AGENT_TRUST_ISOLATION_MODE: production
      AGENT_TRUST_LINUX_TEST_IMAGE: ${{ vars.AGENT_TRUST_LINUX_TEST_IMAGE }}
      AGENT_TRUST_ISOLATION_REPORT: evidence/linux-isolation-report.json
      AGENT_TRUST_RUNSC_BINARY: ${{ vars.AGENT_TRUST_RUNSC_BINARY }}
      AGENT_TRUST_RUNSC_SHA256: ${{ vars.AGENT_TRUST_RUNSC_SHA256 }}
      AGENT_TRUST_DEDICATED_HOST_ATTESTATION: ${{ vars.AGENT_TRUST_DEDICATED_HOST_ATTESTATION }}
      AGENT_TRUST_DEDICATED_HOST_ATTESTATION_SIGNATURE: ${{ vars.AGENT_TRUST_DEDICATED_HOST_ATTESTATION_SIGNATURE }}
      AGENT_TRUST_DEDICATED_HOST_ATTESTATION_PUBLIC_KEY: ${{ vars.AGENT_TRUST_DEDICATED_HOST_ATTESTATION_PUBLIC_KEY }}
      AGENT_TRUST_DEDICATED_HOST_ATTESTATION_PUBLIC_KEY_SHA256: ${{ vars.AGENT_TRUST_DEDICATED_HOST_ATTESTATION_PUBLIC_KEY_SHA256 }}
      AGENT_TRUST_EXPECTED_RUNNER_GROUP: production-isolation
      AGENT_TRUST_EXPECTED_RUNNER_LABELS: self-hosted,linux,gvisor,cgroup-v2,production-isolation,actions-runner-2-327-1,agenttrust-production-gvisor
      AGENT_TRUST_EXPECTED_NODE_POOL: ${{ vars.AGENT_TRUST_GVISOR_NODE_POOL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: {toolchain: "1.89.0"}
      - name: Verify the dedicated runner before running repository tests
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$RUNNER_NAME" = "$(hostname)"
          test -x "$AGENT_TRUST_RUNSC_BINARY"
          test "$AGENT_TRUST_RUNSC_BINARY" = "$(command -v runsc)"
          test -f /sys/fs/cgroup/cgroup.controllers
      - run: cargo test --locked -p agent-trust-sandbox-runtime --all-targets
      - run: ./scripts/run-linux-isolation-gate.sh
      - name: Verify the evidence digest and production-only contract
        run: python3 scripts/verify-linux-isolation-report.py evidence/linux-isolation-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-isolation-evidence
          path: evidence/linux-isolation-report.json
          if-no-files-found: error
