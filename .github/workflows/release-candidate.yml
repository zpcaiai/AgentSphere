              ("AGENT_TRUST_DOCKER_BINARY", "AGENT_TRUST_DOCKER_SHA256"),
              ("AGENT_TRUST_PYTHON_BINARY", "AGENT_TRUST_PYTHON_SHA256"),
          ):
              path = pathlib.Path(os.environ.get(path_name, ""))
              digest = os.environ.get(digest_name, "")
              if not path.is_absolute() or path.is_symlink() or path.resolve() != path:
                  raise SystemExit("RUNNER_TOOL_PATH_INVALID")
              metadata = path.stat(follow_symlinks=False)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_mode & 0o022 or os.access(path, os.W_OK) or not os.access(path, os.X_OK) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("RUNNER_TOOL_PATH_INVALID")
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit("RUNNER_TOOL_DIGEST_INVALID")
              if path_name == "AGENT_TRUST_PYTHON_BINARY" and pathlib.Path(sys.executable).resolve() != path:
                  raise SystemExit("RUNNER_TOOL_RESOLUTION_INVALID")
              if path_name != "AGENT_TRUST_PYTHON_BINARY" and shutil.which(path.name) != str(path):
                  raise SystemExit("RUNNER_TOOL_RESOLUTION_INVALID")
          trust = pathlib.Path(os.environ.get("AGENT_TRUST_GIT_VERIFICATION_CONFIG_FILE", ""))
          if not trust.is_absolute() or trust.is_symlink() or trust.resolve() != trust:
              raise SystemExit("RUNNER_GIT_TRUST_INVALID")
          metadata = trust.stat(follow_symlinks=False)
          if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_mode & 0o022 or not 1 <= metadata.st_size <= 1024 * 1024 or not os.access(trust, os.R_OK) or os.access(trust, os.W_OK):
              raise SystemExit("RUNNER_GIT_TRUST_INVALID")
          PY
          "$AGENT_TRUST_GH_BINARY" --version
          "$AGENT_TRUST_GIT_BINARY" --version
          "$AGENT_TRUST_DOCKER_BINARY" version --format '{{.Client.Version}}'
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test "$("$AGENT_TRUST_DOCKER_BINARY" context inspect --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          test ! -L /var/run/docker.sock
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.immutable-source.outputs.commit_sha }}
          persist-credentials: false
      - name: Verify the immutable candidate Python dependency closure
        run: |
          set -euo pipefail
          "$AGENT_TRUST_PYTHON_BINARY" scripts/verify-production-python-runtime.py verify \
            --manifest "$AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_FILE" \
            --manifest-sha256 "$AGENT_TRUST_PYTHON_RUNTIME_MANIFEST_SHA256" \
            --python-sha256 "$AGENT_TRUST_PYTHON_SHA256" \
            --requirements-lock "$AGENT_TRUST_PYTHON_WHEELHOUSE_DIRECTORY/requirements-ci.lock"
          PIP_CONFIG_FILE=/dev/null "$AGENT_TRUST_PYTHON_BINARY" -m pip check
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: production-image-*-${{ needs.immutable-source.outputs.commit_sha }}
          path: ${{ runner.temp }}/production-image-records
          merge-multiple: true
      - id: manifest
        env:
          RELEASE_ID: ${{ needs.immutable-source.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/production-image-manifest.json"
          "$AGENT_TRUST_PYTHON_BINARY" scripts/assemble-production-image-manifest.py assemble \
            --records-directory "$RUNNER_TEMP/production-image-records" \
            --release-id "$RELEASE_ID" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$output"
          digest="$("$AGENT_TRUST_PYTHON_BINARY" - "$output" <<'PY'
          import hashlib, pathlib, sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          printf 'path=%s\n' "$output" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.manifest.outputs.path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-candidate-${{ needs.immutable-source.outputs.commit_sha }}
          path: ${{ steps.manifest.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - name: Candidate summary
        env:
          MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
        run: |
          printf 'Immutable image manifest SHA-256: %s\n' "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
          printf 'GitHub attestation: %s\n' "$ATTESTATION_URL" >> "$GITHUB_STEP_SUMMARY"
