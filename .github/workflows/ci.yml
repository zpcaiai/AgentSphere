name: control-plane-ci
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  contracts-and-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: {toolchain: "1.89.0", components: "rustfmt,clippy"}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.14"}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: "temurin", java-version: "21"}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/control-console/package-lock.json
      - name: Verify the pinned Node and npm toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate and install checksum-locked Node dependencies
        run: |
          python3 scripts/validate-node-supply-chain.py
          npm --prefix web/control-console ci --no-audit --no-fund --registry=https://registry.npmjs.org
          echo "$GITHUB_WORKSPACE/web/control-console/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate every public OpenAPI contract
        run: |
          for specification in schemas/openapi/*.yaml; do
            openapi-spec-validator "$specification"
          done
      - run: ./scripts/check-generated.sh
      - run: python3 scripts/check-contract-parity.py
      - run: python3 scripts/check-batch-dependency-dag.py
      - run: python3 scripts/validate-enterprise-api-contract.py
      - name: Reject unbounded Rust production HTTP reads
        run: python3 scripts/validate-rust-http-bounds.py
      - run: protoc -I schemas/proto --descriptor_set_out=/tmp/agenttrust.pb --include_imports schemas/proto/agenttrust/v1/contracts.proto schemas/proto/agenttrust/v1/gateway.proto
      - run: ./scripts/run-contract-conformance.sh
      - run: mkdir -p /tmp/domain-pack-sdk && javac -d /tmp/domain-pack-sdk $(find java/domain-pack-sdk/src/main/java java/domain-pack-sdk/src/test/java -name '*.java' -print) && java -cp /tmp/domain-pack-sdk com.agenttrust.pack.PackSdkSmokeTest
      - run: mvn -q -f java/enterprise-control-api/pom.xml test
      - run: python3 -m unittest discover -s python -p 'test_*.py'
      - name: Fail closed on production authority stack drift
        run: python3 -m unittest python.production_gates.tests.test_production_deployment.ProductionDeploymentTests
      - run: tsc --strict --noEmit --target ES2022 --moduleResolution node web/shared/agui-client.ts web/approval-console/src/approval-state.ts web/control-console/src/control-state.ts
      - run: python3 scripts/validate-runtime-assets.py
      - name: Validate production runtime adapter and external-condition closure
        run: python3 scripts/audit-production-runtime.py
      - name: Verify the offline non-certificate evidence bundle
        run: python3 scripts/verify-evidence-bundle.py
      - run: |
          npm --prefix web/control-console run check:api
          npm --prefix web/control-console run test
          if env -u VITE_CONTROL_API_URL npm --prefix web/control-console run build >/tmp/control-console-negative.log 2>&1; then
            echo "unsafe production build unexpectedly succeeded" >&2
            exit 1
          fi
          if ! grep -Fq "VITE_CONTROL_API_URL must be an absolute HTTPS URL" /tmp/control-console-negative.log; then
            echo "::error title=Control console negative build failed early::Expected the production configuration gate, but another error stopped the build first." >&2
            echo "Bounded tail of control-console-negative.log (at most 200 lines and 32 KiB):" >&2
            stop_token="$(openssl rand -hex 32)"
            echo "::stop-commands::${stop_token}" >&2
            tail -n 200 /tmp/control-console-negative.log | tail -c 28672 | sed 's/^/negative-build: /' >&2
            echo "::${stop_token}::" >&2
            exit 1
          fi
          npm --prefix web/control-console run build
        env:
          VITE_CONTROL_API_URL: https://control-api.invalid
          # Deterministic non-secret Ed25519 public-key bytes for compile-time verifier wiring.
          VITE_AGUI_VERIFY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compile and test the explicitly gated development-only closure signer
        run: cargo test --locked -p agent-trust-production-closure --all-features --all-targets
      - run: cargo test --locked --workspace --all-targets

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - name: Install checksum-pinned OPA
        shell: bash
        run: |
          set -euo pipefail
          readonly opa_version="1.19.0"
          readonly expected_sha256="1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f"
          readonly opa_binary="${RUNNER_TEMP}/opa_linux_amd64_static"
          readonly urls=(
            "https://github.com/open-policy-agent/opa/releases/download/v${opa_version}/opa_linux_amd64_static"
            "https://openpolicyagent.org/downloads/v${opa_version}/opa_linux_amd64_static"
          )
          downloaded=false
          for url in "${urls[@]}"; do
            rm -f "${opa_binary}.partial"
            if curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 180 \
              --output "${opa_binary}.partial" "${url}"; then
              mv "${opa_binary}.partial" "${opa_binary}"
              downloaded=true
              break
            fi
          done
          if [[ "${downloaded}" != true ]]; then
            echo "OPA download failed from every approved source" >&2
            exit 1
          fi
          printf '%s  %s\n' "${expected_sha256}" "${opa_binary}" | sha256sum --check --strict -
          sudo install -m 0755 "${opa_binary}" /usr/local/bin/opa
      - name: Test Rego policy with the pinned OPA version
        run: |
          opa version | grep -F "Version: 1.19.0"
          opa test policies -v

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenttrust
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agenttrust"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      AGENT_TRUST_ENTERPRISE_APPLICATION_ROLE: agenttrust_enterprise_ci
      AGENT_TRUST_ENTERPRISE_AUTHORITY_APPLICATION_ROLE: agenttrust_enterprise_authority_ci
      AGENT_TRUST_ORCHESTRATOR_APPLICATION_ROLE: agenttrust_orchestrator_ci
      AGENT_TRUST_EXECUTION_APPLICATION_ROLE: agenttrust_execution_ci
      AGENT_TRUST_REGISTRY_APPLICATION_ROLE: agenttrust_registry_ci
      AGENT_TRUST_AGENT_REGISTRY_APPLICATION_ROLE: agenttrust_agent_registry_ci
      AGENT_TRUST_POLICY_ADMIN_APPLICATION_ROLE: agenttrust_policy_admin_ci
      AGENT_TRUST_INCIDENT_RELEASE_APPLICATION_ROLE: agenttrust_incident_release_ci
      AGENT_TRUST_PACK_MARKETPLACE_APPLICATION_ROLE: agenttrust_pack_marketplace_ci
      AGENT_TRUST_APPROVAL_APPLICATION_ROLE: agenttrust_approval_ci
      AGENT_TRUST_PEP_APPLICATION_ROLE: agenttrust_pep_ci
      AGENT_TRUST_IDENTITY_APPLICATION_ROLE: agenttrust_identity_ci
      AGENT_TRUST_TOOL_PROXY_APPLICATION_ROLE: agenttrust_tool_proxy_ci
      AGENT_TRUST_EVIDENCE_APPLICATION_ROLE: agenttrust_evidence_ci
      AGENT_TRUST_AUDIT_APPLICATION_ROLE: agenttrust_audit_ci
      AGENT_TRUST_MODEL_GATEWAY_APPLICATION_ROLE: agenttrust_model_gateway_ci
      AGENT_TRUST_DATA_GOVERNANCE_APPLICATION_ROLE: agenttrust_data_governance_ci
      AGENT_TRUST_CONTEXT_GOVERNANCE_APPLICATION_ROLE: agenttrust_context_governance_ci
      AGENT_TRUST_RUNTIME_ANOMALY_APPLICATION_ROLE: agenttrust_runtime_anomaly_ci
      AGENT_TRUST_SECURITY_EVALUATION_APPLICATION_ROLE: agenttrust_security_eval_ci
      AGENT_TRUST_PACK_SUPPLY_CHAIN_APPLICATION_ROLE: agenttrust_pack_supply_chain_ci
      AGENT_TRUST_DOMAIN_RUNTIME_APPLICATION_ROLE: agenttrust_domain_runtime_ci
      AGENT_TRUST_PLATFORM_SRE_APPLICATION_ROLE: agenttrust_platform_sre_ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: {toolchain: "1.89.0"}
      - name: Validate production migration entrypoint syntax
        run: sh -n scripts/run-production-migrations.sh
      - name: Validate immutable migration manifest
        run: python3 scripts/validate-production-migrations.py
      - name: Enable verify-full TLS on the PostgreSQL service
        run: |
          set -eu
          ca_file="$RUNNER_TEMP/agenttrust-ci-postgres-ca.pem"
          key_file="$RUNNER_TEMP/agenttrust-ci-postgres-server.key"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$key_file" -out "$ca_file" >/dev/null 2>&1
          postgres_container=$(docker ps --filter ancestor=postgres:17.5 --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"
          docker cp "$ca_file" "$postgres_container:/var/lib/postgresql/server.crt"
          docker cp "$key_file" "$postgres_container:/var/lib/postgresql/server.key"
          docker exec --user root "$postgres_container" \
            chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          docker exec --user root "$postgres_container" \
            chmod 0644 /var/lib/postgresql/server.crt
          docker exec --user root "$postgres_container" \
            chmod 0600 /var/lib/postgresql/server.key
          docker exec --user root "$postgres_container" sh -c \
            "printf '%s\\n' \"ssl=on\" \"ssl_min_protocol_version='TLSv1.3'\" \"ssl_cert_file='/var/lib/postgresql/server.crt'\" \"ssl_key_file='/var/lib/postgresql/server.key'\" >> /var/lib/postgresql/data/postgresql.conf"
          docker restart "$postgres_container" >/dev/null
          attempt=0
          until pg_isready -h 127.0.0.1 -U postgres -d agenttrust >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              echo 'PostgreSQL did not become ready after TLS restart' >&2
              exit 1
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -U postgres -d agenttrust
          tls_verified=$(PGPASSWORD=postgres PGSSLMODE=verify-full PGSSLROOTCERT="$ca_file" \
            PGSSLMINPROTOCOLVERSION=TLSv1.3 PGCHANNELBINDING=require \
            PGGSSENCMODE=disable \
            psql -h localhost -U postgres -d agenttrust -Atc \
            "SELECT ssl::text || ':' || version FROM pg_stat_ssl WHERE pid=pg_backend_pid()")
          test "$tls_verified" = true:TLSv1.3
          printf 'AGENT_TRUST_CI_DATABASE_CA_FILE=%s\n' "$ca_file" >> "$GITHUB_ENV"
      - name: Bootstrap least-privilege migration and application roles
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d agenttrust <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE agenttrust_migration_ci LOGIN NOINHERIT NOSUPERUSER
            NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'agenttrust-ci-migration-password';
          ALTER DATABASE agenttrust OWNER TO agenttrust_migration_ci;
          ALTER SCHEMA public OWNER TO agenttrust_migration_ci;
          DO $application_roles$
          DECLARE
            role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'agenttrust_enterprise_ci', 'agenttrust_enterprise_authority_ci',
              'agenttrust_orchestrator_ci', 'agenttrust_execution_ci',
              'agenttrust_registry_ci', 'agenttrust_agent_registry_ci',
              'agenttrust_policy_admin_ci', 'agenttrust_incident_release_ci',
              'agenttrust_pack_marketplace_ci', 'agenttrust_approval_ci',
              'agenttrust_pep_ci', 'agenttrust_identity_ci', 'agenttrust_tool_proxy_ci',
              'agenttrust_evidence_ci', 'agenttrust_audit_ci', 'agenttrust_model_gateway_ci',
              'agenttrust_data_governance_ci', 'agenttrust_context_governance_ci',
              'agenttrust_runtime_anomaly_ci', 'agenttrust_security_eval_ci',
              'agenttrust_pack_supply_chain_ci', 'agenttrust_domain_runtime_ci',
              'agenttrust_platform_sre_ci'
            ] LOOP
              EXECUTE format(
                'CREATE ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS',
                role_name
              );
            END LOOP;
          END
          $application_roles$;
          SQL
      - name: Prove migration body and history rollback together
        run: |
          database_url_file="$RUNNER_TEMP/agenttrust-ci-database-url"
          printf 'postgresql://agenttrust_migration_ci@localhost:5432/agenttrust?sslmode=verify-full&sslrootcert=%s\n' \
            "$AGENT_TRUST_CI_DATABASE_CA_FILE" > "$database_url_file"
          chmod 0600 "$database_url_file"
          database_password_file="$RUNNER_TEMP/agenttrust-ci-database-password"
          printf '%s\n' 'agenttrust-ci-migration-password' > "$database_password_file"
          chmod 0600 "$database_password_file"
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d agenttrust <<'SQL'
          CREATE TABLE public.agenttrust_schema_migrations (
            migration_path text PRIMARY KEY,
            content_sha256 char(64) NOT NULL,
            release_id text NOT NULL,
            applied_at timestamptz NOT NULL DEFAULT now(),
            applied_by text NOT NULL DEFAULT current_user
          );
          ALTER TABLE public.agenttrust_schema_migrations OWNER TO agenttrust_migration_ci;
          CREATE FUNCTION public.reject_first_migration_history() RETURNS trigger
          LANGUAGE plpgsql AS $fault$
          BEGIN
            IF NEW.migration_path='identity/0001_identity.sql' THEN
              RAISE EXCEPTION 'CI_FORCED_HISTORY_FAILURE';
            END IF;
            RETURN NEW;
          END
          $fault$;
          CREATE TRIGGER reject_first_migration_history
            BEFORE INSERT ON public.agenttrust_schema_migrations
            FOR EACH ROW EXECUTE FUNCTION public.reject_first_migration_history();
          REVOKE ALL ON FUNCTION public.reject_first_migration_history() FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION public.reject_first_migration_history() TO agenttrust_migration_ci;
          SQL
          export AGENT_TRUST_MIGRATIONS_ROOT="$GITHUB_WORKSPACE/migrations"
          atomic_manifest="$RUNNER_TEMP/agenttrust-atomic-manifest.txt"
          printf '%s\n' 'identity/0001_identity.sql' > "$atomic_manifest"
          chmod 0600 "$atomic_manifest"
          export AGENT_TRUST_MIGRATION_MANIFEST="$atomic_manifest"
          export AGENT_TRUST_DATABASE_URL_FILE="$database_url_file"
          export AGENT_TRUST_DATABASE_PASSWORD_FILE="$database_password_file"
          export AGENT_TRUST_DATABASE_CA_FILE="$AGENT_TRUST_CI_DATABASE_CA_FILE"
          export AGENT_TRUST_RELEASE_ID="git:sha1:$GITHUB_SHA"
          atomic_log="$RUNNER_TEMP/agenttrust-atomic-rollback.log"
          if sh scripts/run-production-migrations.sh --apply \
            >"$atomic_log" 2>&1; then
            echo 'forced history failure unexpectedly succeeded' >&2
            exit 1
          fi
          if ! grep -q 'CI_FORCED_HISTORY_FAILURE' "$atomic_log"; then
            echo 'runner failed before the forced history fault was observed' >&2
            sed -n '1,240p' "$atomic_log" >&2
            exit 1
          fi
          rollback_ok=$(PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U postgres -d agenttrust -c \
            "SELECT to_regclass('public.trust_bundles') IS NULL AND NOT EXISTS (SELECT 1 FROM public.agenttrust_schema_migrations)")
          if [ "$rollback_ok" != t ]; then
            echo "migration body/history rollback assertion failed: $rollback_ok" >&2
            sed -n '1,240p' "$atomic_log" >&2
            exit 1
          fi
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d agenttrust <<'SQL'
          DROP TRIGGER reject_first_migration_history ON public.agenttrust_schema_migrations;
          DROP FUNCTION public.reject_first_migration_history();
          SQL
      - name: Apply and verify the production migration runner twice
        run: |
          database_url_file="$RUNNER_TEMP/agenttrust-ci-database-url"
          export AGENT_TRUST_MIGRATIONS_ROOT="$GITHUB_WORKSPACE/migrations"
          export AGENT_TRUST_MIGRATION_MANIFEST="$GITHUB_WORKSPACE/migrations/manifest.txt"
          export AGENT_TRUST_DATABASE_URL_FILE="$database_url_file"
          export AGENT_TRUST_DATABASE_PASSWORD_FILE="$RUNNER_TEMP/agenttrust-ci-database-password"
          export AGENT_TRUST_DATABASE_CA_FILE="$AGENT_TRUST_CI_DATABASE_CA_FILE"
          export AGENT_TRUST_RELEASE_ID="git:sha1:$GITHUB_SHA"
          sh scripts/run-production-migrations.sh --apply
          sh scripts/run-production-migrations.sh --apply
          sh scripts/run-production-migrations.sh --check
      - name: Replay every standalone migration after the runner
        run: |
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' migrations/manifest.txt |
            while IFS= read -r migration; do
              case "$migration" in
                (*[!A-Za-z0-9._/-]*|*..*) echo "unsafe migration path: $migration" >&2; exit 1 ;;
              esac
              PGPASSWORD=agenttrust-ci-migration-password \
                PGHOST=localhost PGPORT=5432 PGUSER=agenttrust_migration_ci \
                PGDATABASE=agenttrust PGSSLMODE=verify-full \
                PGSSLROOTCERT="$AGENT_TRUST_CI_DATABASE_CA_FILE" \
                PGSSLMINPROTOCOLVERSION=TLSv1.3 PGCHANNELBINDING=require \
                PGGSSENCMODE=disable PGCLIENTENCODING=UTF8 \
                psql --no-psqlrc -v ON_ERROR_STOP=1 -f "migrations/$migration"
            done
      - name: Recheck production migration history after standalone replay
        run: |
          export AGENT_TRUST_MIGRATIONS_ROOT="$GITHUB_WORKSPACE/migrations"
          export AGENT_TRUST_MIGRATION_MANIFEST="$GITHUB_WORKSPACE/migrations/manifest.txt"
          export AGENT_TRUST_DATABASE_URL_FILE="$RUNNER_TEMP/agenttrust-ci-database-url"
          export AGENT_TRUST_DATABASE_PASSWORD_FILE="$RUNNER_TEMP/agenttrust-ci-database-password"
          export AGENT_TRUST_DATABASE_CA_FILE="$AGENT_TRUST_CI_DATABASE_CA_FILE"
          export AGENT_TRUST_RELEASE_ID="git:sha1:$GITHUB_SHA"
          sh scripts/run-production-migrations.sh --check
      - name: Verify enterprise RLS with a non-bypass application role
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d agenttrust <<'SQL'
          CREATE ROLE enterprise_ci_app NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO enterprise_ci_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO enterprise_ci_app;
          SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',false);
          INSERT INTO enterprise_tenants(tenant_id,display_name,owner_subject,data_region,quota)
            VALUES ('11111111-1111-4111-8111-111111111111','CI Tenant','owner:ci','US','{}');
          SET ROLE enterprise_ci_app;
          SELECT set_config('app.tenant_id','22222222-2222-4222-8222-222222222222',false);
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM enterprise_tenants WHERE tenant_id='11111111-1111-4111-8111-111111111111') THEN
              RAISE EXCEPTION 'cross tenant row visible';
            END IF;
          END $$;
          SQL
      - env:
          AGENT_TRUST_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agenttrust
        run: cargo test --locked -p agent-trust-integration-tests --test postgres_persistence -- --nocapture
