openapi: 3.1.0
info:
  title: Agent Trust Durable Orchestrator API
  version: 1.0.0
  description: >-
    Internal production API for durable admission, lifecycle commands, task queries,
    event retrieval, and the authoritative Rust transition activity boundary.
  x-agenttrust-transition-management:
    defaultListen: 127.0.0.1
    defaultPort: 9091
    path: /ready
    exposedRoutes: [/ready]
    description: >-
      Plain HTTP, separately bound management listener for dependency-aware readiness only.
      Production deployments must restrict network access to platform health probes; the
      transition data plane remains TLS 1.3 with mandatory client certificates.
  x-agenttrust-transition-authentication:
    bindingSchema: agenttrust.transition-token-bindings.v1
    bindingFields: [client_identity, tenant_id, scope, token_sha256]
    requiredScope: transitions:apply
    description: >-
      Each data-plane bearer is authorized only when its lowercase SHA-256 digest and the
      verified client-certificate SAN, tenant, and scope exactly match one binding. The service
      does not accept one global bearer as authority for every tenant.
  x-agenttrust-orchestrator-authentication:
    bindingSchema: agenttrust.orchestrator-token-bindings.v1
    bindingFields: [client_identity, tenant_id, subject, scope, token_sha256]
    scopes: [orchestrator:runtime, orchestrator:read, orchestrator:command,
             orchestrator:transitions]
    description: >-
      Every non-readiness request binds one canonical tenant header, one exact certificate SAN,
      one route-fixed scope and one independently rotatable opaque-token digest. Reusing a raw
      token across scopes is rejected when the binding document is loaded.
  x-agenttrust-worker-management:
    defaultListen: 127.0.0.1
    defaultPort: 9092
    path: /ready
    exposedRoutes: [/ready]
    timeoutSeconds: 1.5
    description: >-
      Plain HTTP management listener for the Temporal worker. It returns ready only when
      Temporal and the mTLS transition and execution dependencies all pass their strict
      versioned JSON readiness contracts. Restrict access to platform health probes.
servers:
  - url: https://orchestrator.internal.example
security:
  - orchestratorServiceBearer: []
    mutualTLS: []
tags:
  - name: Orchestrator
  - name: Transition
paths:
  /ready:
    get:
      security: []
      tags: [Orchestrator]
      operationId: orchestratorReady
      responses:
        '200':
          description: >-
            PostgreSQL with the expected non-superuser RLS role, Temporal, transition, and
            execution dependencies are reachable within the bounded readiness deadline.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, ready]
                properties:
                  schema_version: {const: agenttrust.orchestrator-readiness.v1}
                  ready: {const: true}
        '503': {$ref: '#/components/responses/Error'}
  /v1/actions:
    post:
      tags: [Orchestrator]
      operationId: createTask
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      description: >-
        Admits an idempotent gateway envelope, starts its workflow, and durably signals START.
        A side-effecting Canonical Action payload must bind both current_state_version and a
        lowercase SHA-256 extensions.x-plan-hash before admission; otherwise the request fails
        closed before a Temporal workflow is created. The response includes immutable START
        acceptance evidence but explicitly keeps execution pending.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngressEnvelope'}
      responses:
        '200':
          description: Action admitted and START requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngressReceipt'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/actions/query:
    post:
      tags: [Orchestrator]
      operationId: queryTask
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody: {$ref: '#/components/requestBodies/ActionScope'}
      responses:
        '200':
          description: Authoritative Temporal state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskView'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/actions/start:
    post: &commandOperation
      tags: [Orchestrator]
      operationId: startTask
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody: {$ref: '#/components/requestBodies/CommandScope'}
      responses:
        '200':
          description: Command durably signaled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/actions/pause:
    post:
      <<: *commandOperation
      operationId: pauseTask
  /v1/actions/resume:
    post:
      <<: *commandOperation
      operationId: resumeTask
  /v1/actions/cancel:
    post:
      <<: *commandOperation
      operationId: cancelTask
  /v1/actions/kill:
    post:
      <<: *commandOperation
      operationId: killTask
  /v1/actions/checkpoint:
    post:
      <<: *commandOperation
      operationId: checkpointTask
  /v1/actions/verify:
    post:
      <<: *commandOperation
      operationId: verifyTask
  /v1/actions/complete:
    post:
      <<: *commandOperation
      operationId: completeTask
  /v1/tasks/list:
    post:
      tags: [Orchestrator]
      operationId: listTasks
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/OwnerScope'}
                - type: object
                  properties:
                    limit: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: Bounded task list.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/TaskSummary'}
        '400': {$ref: '#/components/responses/Error'}
  /v1/authoritative/tasks:
    get:
      tags: [Orchestrator]
      operationId: authoritativeTaskInventory
      security: [{orchestratorServiceBearer: [], mutualTLS: []}]
      description: >-
        Tenant- and actor-bound view over authoritative Temporal workflow state. Ingress rows
        are used only as an index and never as proof that a task or execution completed.
      parameters:
        - {$ref: '#/components/parameters/TenantHeader'}
        - {$ref: '#/components/parameters/LegacyTenantHeader'}
        - {$ref: '#/components/parameters/ActorHeader'}
        - {name: resource, in: query, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,99}$'}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Bounded authoritative task page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthoritativeTaskPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/tasks/events:
    post:
      tags: [Orchestrator]
      operationId: taskEvents
      security: [{orchestratorServiceBearer: [], mutualTLS: []}]
      description: >-
        The mTLS-authenticated BFF must supply tenant and actor headers exactly matching
        tenant_id and owner in the compatibility request body.
      parameters:
        - {$ref: '#/components/parameters/TenantHeader'}
        - {$ref: '#/components/parameters/LegacyTenantHeader'}
        - {$ref: '#/components/parameters/ActorHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/TaskScope'}
                - type: object
                  properties:
                    limit: {type: integer, minimum: 1, maximum: 1000, default: 1000}
      responses:
        '200':
          description: Submission and authoritative transition events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    maxItems: 1000
                    items: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/Error'}
  /v1/tasks/transitions:
    post:
      tags: [Orchestrator]
      operationId: authoritativeTaskTransitions
      security: [{orchestratorServiceBearer: [], mutualTLS: []}]
      description: >-
        Returns only the tenant-bound authoritative transition ring and current Temporal state.
        Submission and rejection audit entries are never mixed into this recovery surface.
      parameters:
        - {$ref: '#/components/parameters/TenantHeader'}
        - {$ref: '#/components/parameters/LegacyTenantHeader'}
        - {$ref: '#/components/parameters/ActorHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/TaskScope'}
                - type: object
                  properties:
                    limit: {type: integer, minimum: 1, maximum: 1000, default: 1000}
      responses:
        '200':
          description: Current state plus bounded authoritative transition ring.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthoritativeTaskTransitions'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/commands:
    post:
      tags: [Orchestrator]
      operationId: submitBffTaskCommand
      security: [{orchestratorServiceBearer: [], mutualTLS: []}]
      description: >-
        The TLS peer must match the configured enterprise-control-api DNS or SPIFFE SAN.
        X-Tenant-Id and X-Actor-Subject are trusted only inside that exact service boundary.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - {$ref: '#/components/parameters/TenantHeader'}
        - {$ref: '#/components/parameters/LegacyTenantHeader'}
        - {$ref: '#/components/parameters/ActorHeader'}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicTaskCommand'}
      responses:
        '200':
          description: Authenticated, tenant-derived command accepted.
          content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/agui/events:
    get:
      tags: [Orchestrator]
      operationId: resumeBffAguiEvents
      security: [{orchestratorServiceBearer: [], mutualTLS: []}]
      description: >-
        Resumes signed events through the exact authenticated BFF workload identity. Cursor
        gaps return safe_snapshot_required=true and an ahead-of-authority cursor is rejected.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - {$ref: '#/components/parameters/TenantHeader'}
        - {$ref: '#/components/parameters/LegacyTenantHeader'}
        - {$ref: '#/components/parameters/ActorHeader'}
        - {name: resume_token, in: query, schema: {type: string, pattern: '^[0-9]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: Signed, bounded AG-UI transition events.
          content: {application/json: {schema: {$ref: '#/components/schemas/AguiResumeResponse'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/tasks/stream-snapshot:
    post:
      tags: [Orchestrator]
      operationId: taskStreamSnapshot
      security: [{orchestratorServiceBearer: [], mutualTLS: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskScope'}
      responses:
        '200':
          description: Gateway-compatible canonical JSON event strings.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    maxItems: 1000
                    items: {type: string, maxLength: 65536}
        '404': {$ref: '#/components/responses/Error'}
  /v1/transitions/apply:
    post:
      tags: [Transition]
      operationId: applyAuthoritativeTransition
      servers:
        - url: https://transition.internal.example
      security: [{transitionBearer: [], mutualTLS: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200':
          description: Next authoritative state. Caller-supplied facts are not accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowState'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    transitionBearer:
      type: http
      scheme: bearer
    orchestratorServiceBearer:
      type: http
      scheme: bearer
    mutualTLS:
      type: mutualTLS
  parameters:
    TenantHeader:
      name: X-AgentTrust-Tenant-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    LegacyTenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: If supplied by the enterprise BFF, it must exactly equal X-AgentTrust-Tenant-Id.
      schema: {$ref: '#/components/schemas/Uuid'}
    ActorHeader:
      name: X-Actor-Subject
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$'}
  responses:
    Error:
      description: Stable fail-closed machine error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              schema_version: {type: string}
              error: {type: string, pattern: '^ORCHESTRATOR_[A-Z0-9_]+$'}
  requestBodies:
    ActionScope:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ActionScope'}
    CommandScope:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandScope'}
  schemas:
    Uuid:
      type: string
      format: uuid
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    OwnerScope:
      type: object
      required: [tenant_id, owner]
      properties:
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        owner: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$'}
    ActionScope:
      allOf:
        - {$ref: '#/components/schemas/OwnerScope'}
        - type: object
          required: [action_id]
          properties:
            action_id: {$ref: '#/components/schemas/Uuid'}
    TaskScope:
      allOf:
        - {$ref: '#/components/schemas/OwnerScope'}
        - type: object
          required: [task_id]
          properties:
            task_id: {$ref: '#/components/schemas/Uuid'}
    CommandScope:
      allOf:
        - {$ref: '#/components/schemas/ActionScope'}
        - type: object
          properties:
            command_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._:-]+$'}
    IdentityContext:
      type: object
      additionalProperties: false
      required: [subject, tenant_id, owner_subject, agent_instance_id, trust_level]
      properties:
        subject: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$'}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        owner_subject: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$'}
        agent_instance_id: {$ref: '#/components/schemas/Uuid'}
        trust_level: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    TenantContext:
      type: object
      additionalProperties: false
      required: [tenant_id, quota_profile]
      properties:
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        quota_profile: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    TraceContext:
      type: object
      additionalProperties: false
      required: [trace_id, parent_span_id, invalid_input_replaced]
      properties:
        trace_id: {type: string, pattern: '^[0-9A-Fa-f]{32}$'}
        parent_span_id:
          anyOf:
            - {type: string, pattern: '^[0-9A-Fa-f]{16}$'}
            - {type: 'null'}
        invalid_input_replaced: {type: boolean}
    IngressEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, trace_context, identity_context, tenant_context, protocol,
                 content_type, schema_version, idempotency_key, received_at, payload, payload_hash]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
        trace_context: {$ref: '#/components/schemas/TraceContext'}
        identity_context: {$ref: '#/components/schemas/IdentityContext'}
        tenant_context: {$ref: '#/components/schemas/TenantContext'}
        protocol: {const: HTTP}
        content_type: {type: string, pattern: '^application/json(?:;.*)?$'}
        schema_version: {const: agenttrust.gateway.v1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
        received_at: {type: string, format: date-time}
        payload:
          type: array
          maxItems: 1048576
          items: {type: integer, minimum: 0, maximum: 255}
        payload_hash: {$ref: '#/components/schemas/Digest'}
    IngressReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, task_id, accepted, start_requested,
                 execution_pending, ingress_digest, evidence_ref, evidence_digest]
      properties:
        schema_version: {const: agenttrust.action-acceptance.v1}
        action_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        accepted: {const: true}
        start_requested: {const: true}
        execution_pending: {const: true}
        ingress_digest: {$ref: '#/components/schemas/Digest'}
        evidence_ref:
          type: string
          pattern: '^orchestrator-event://[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[1-9][0-9]*$'
        evidence_digest: {$ref: '#/components/schemas/Digest'}
    CommandReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, accepted, command_id, evidence_ref, evidence_digest,
                 execution_pending]
      properties:
        schema_version: {const: agenttrust.command-receipt.v1}
        accepted: {const: true}
        command_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._:-]+$'}
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^orchestrator-event://[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[1-9][0-9]*$'
        evidence_digest: {$ref: '#/components/schemas/Digest'}
        execution_pending:
          const: true
          description: Durable command acceptance is separate from process execution success.
    TaskSummary:
      type: object
      required: [action_id, task_id, status, recovery_cursor, terminal]
      properties:
        action_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/TaskStatus'}
        recovery_cursor: {type: integer, minimum: 0}
        terminal: {type: boolean}
    AuthoritativeTaskPage:
      type: object
      additionalProperties: false
      required: [schema_version, authoritative, tenant_id, resource, items, next_cursor,
                 data_digest]
      properties:
        schema_version: {const: agenttrust.authoritative-task-page.v1}
        authoritative: {const: true}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        resource: {type: string, pattern: '^[a-z][a-z0-9_-]{0,99}$'}
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AuthoritativeTaskView'}
        next_cursor: {type: 'null'}
        data_digest: {$ref: '#/components/schemas/Digest'}
    AuthoritativeTaskView:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, task_id, status, recovery_cursor, terminal]
      properties:
        schema_version: {const: agenttrust.task-view.v1}
        action_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/TaskStatus'}
        recovery_cursor: {type: integer, minimum: 0}
        terminal: {type: boolean}
    TaskView:
      allOf:
        - {$ref: '#/components/schemas/TaskSummary'}
        - type: object
          required: [tenant_id, owner_subject, evidence_refs]
          properties:
            tenant_id: {$ref: '#/components/schemas/Uuid'}
            owner_subject: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$'}
            evidence_refs:
              type: array
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 2048}
    AuthoritativeTaskTransitions:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, task_id, status, recovery_cursor, terminal,
                 evidence_digest, occurred_at, transitions]
      properties:
        schema_version: {const: agenttrust.authoritative-task-transitions.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/TaskStatus'}
        recovery_cursor: {type: integer, minimum: 0, maximum: 1000000}
        terminal: {type: boolean}
        evidence_digest:
          anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]
        occurred_at:
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
        transitions:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/TransitionEvent'}
    TransitionEvent:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, command_id, from, to, recovery_cursor,
                 evidence_digest, occurred_at]
      properties:
        schema_version: {const: agenttrust.orchestrator-state.v1}
        event_id: {type: string, minLength: 1, maxLength: 256}
        command_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._:-]+$'}
        from: {$ref: '#/components/schemas/TaskStatus'}
        to: {$ref: '#/components/schemas/TaskStatus'}
        recovery_cursor: {type: integer, minimum: 1, maximum: 1000000}
        evidence_digest: {$ref: '#/components/schemas/Digest'}
        occurred_at: {type: string, format: date-time}
    TaskStatus:
      type: string
      enum: [CREATED, PLANNED, POLICY_CHECKED, APPROVAL_PENDING, APPROVED, RUNNING,
             PAUSE_REQUESTED, PAUSED, CANCEL_REQUESTED, CANCELLING, KILL_REQUESTED,
             KILLED, VERIFYING, COMPLETED, DENIED, FAILED, EVALUATION_FAILED,
             COMPENSATING, ROLLED_BACK, NEEDS_HUMAN, MANUAL_RECOVERY_REQUIRED]
    WorkflowCommand:
      type: object
      additionalProperties: false
      required: [schema_version, command_id, request_idempotency_key, tenant_id, task_id, command_type,
                 expected_state_version, payload_digest, requested_by, requested_at]
      properties:
        schema_version: {const: agenttrust.orchestrator-command.v1}
        command_id: {type: string, minLength: 1, maxLength: 256}
        request_idempotency_key: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._:-]+$'}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        command_type:
