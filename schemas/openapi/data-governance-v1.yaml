openapi: 3.1.0
info:
  title: Agent Trust Data Governance Authority
  version: 1.0.0
  description: >-
    Tenant-scoped data classification, policy, DLP, transformation, cross-domain,
    retention, legal-hold, and export authority. Durable writes traverse Canonical
    Action IR, PEP, ledger, fence, and Evidence. Inspection content is ephemeral
    and is never persisted or logged.
servers:
  - url: https://data-governance.internal:8092
security:
  - mutualTls: []
    scopedBearer: []
paths:
  /ready:
    get:
      operationId: dataGovernanceReady
      security:
        - mutualTls: []
      responses:
        '200':
          description: All mandatory authorities are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/data/actions:
    post:
      operationId: submitDataGovernanceAction
      description: Normalize a metadata-only mutation into Canonical Action IR.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../data-governance/data-command.schema.json
      responses:
        '202':
          description: Canonical action accepted by the durable orchestrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/data/executions:
    post:
      operationId: executeDataGovernanceAction
      description: >-
        Tool Proxy executor boundary. Every authorization, policy, ledger, fence,
        and Evidence header is mandatory and exactly bound to the admitted action.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Idempotency'
        - $ref: '#/components/parameters/ActionHash'
        - $ref: '#/components/parameters/LedgerExecutionId'
        - $ref: '#/components/parameters/LedgerEntryId'
        - $ref: '#/components/parameters/LedgerEntryDigest'
        - $ref: '#/components/parameters/FenceDigest'
        - $ref: '#/components/parameters/ResourceVersion'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/PolicyDecisionId'
        - $ref: '#/components/parameters/PolicyDecisionDigest'
        - $ref: '#/components/parameters/AuthorizationEvidenceRef'
        - $ref: '#/components/parameters/AuthorizationEvidenceDigest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutorRequest'
      responses:
        '200':
          description: Mutation completed and Evidence delivery acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/internal/data/evaluate:
    post:
      operationId: evaluateDataPolicy
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../data-governance/inspection.schema.json#/$defs/policyEvaluation
      responses:
        '200':
          description: Deterministic policy result plus a durable-record proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEvaluationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/internal/data/scan:
    post:
      operationId: inspectDataWithDlp
      description: >-
        Bounded ephemeral content scan. Enterprise DLP unavailability fails closed;
        raw content is not written to PostgreSQL, Evidence, traces, or logs.
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../data-governance/inspection.schema.json#/$defs/dlpInspection
      responses:
        '200':
          description: DLP summary and durable-record proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpInspectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/internal/data/sanitize:
    post:
      operationId: sanitizePromptData
      description: Secret content is denied; PII transforms return hashes and ephemeral transformed bytes.
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../data-governance/inspection.schema.json#/$defs/promptSanitization
      responses:
        '200':
          description: Sanitized content and transformation receipt proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptSanitizationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/internal/data/artifacts/authorize:
    post:
      operationId: authorizeArtifactExport
      description: >-
        Re-inspects exact artifact bytes, re-evaluates data policy, validates the
        exact tenant-RLS durable label, decision, DLP, required-transform, and cross-domain grant
        bindings, denies redirect chains, and obtains object/WORM authorization.
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../data-governance/inspection.schema.json#/$defs/artifactAuthorization
      responses:
        '200':
          description: Durable-preflight-verified authorization; a governed durable export intent is still required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactAuthorizationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/authoritative/data/resources:
    get:
      operationId: listAuthoritativeDataResources
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: after
          in: query
          schema: {type: string, maxLength: 1024}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Tenant-scoped authoritative resource fences with a canonical page digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoritativePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/authoritative/data/mutations/{command_id}:
    get:
      operationId: getCompletedDataGovernanceMutation
      description: >-
        Returns only the tenant-scoped final mutation. A pending execution fails closed and never
        exposes its durable-record proposal as completed Evidence.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: command_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
      responses:
        '200':
          description: Completed authoritative mutation with final Evidence reference and digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    mutualTls:
      type: mutualTLS
      description: TLS 1.3 client certificate with exactly one authorized DNS or URI SAN.
    scopedBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: SHA-256-bound to exactly one SAN, tenant, subject, and route scope.
  parameters:
    Tenant:
      name: X-AgentTrust-Tenant-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9._-]{16,256}$'}
    ActionHash:
      name: X-AgentTrust-Action-Hash
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    LedgerExecutionId:
      name: X-AgentTrust-Ledger-Execution-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    LedgerEntryId:
      name: X-AgentTrust-Ledger-Entry-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    LedgerEntryDigest:
      name: X-AgentTrust-Ledger-Entry-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    FenceDigest:
      name: X-AgentTrust-Fence-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    ResourceVersion:
      name: X-AgentTrust-Resource-Version
      in: header
      required: true
      schema: {type: integer, minimum: 0}
    TraceId:
      name: X-AgentTrust-Trace-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    PolicyDecisionId:
      name: X-AgentTrust-Policy-Decision-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    PolicyDecisionDigest:
      name: X-AgentTrust-Policy-Decision-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    AuthorizationEvidenceRef:
      name: X-AgentTrust-Authorization-Evidence-Ref
      in: header
      required: true
      schema: {type: string, pattern: '^evidence://', maxLength: 2048}
    AuthorizationEvidenceDigest:
      name: X-AgentTrust-Authorization-Evidence-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
  schemas:
    Digest:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Readiness:
      type: object
      additionalProperties: false
      required: [schema_version, ready, database_ready, orchestrator_ready, enterprise_dlp_ready, object_worm_ready, legal_hold_ready, evidence_ready]
      properties:
        schema_version: {const: agenttrust.data-governance-readiness.v1}
        ready: {const: true}
        database_ready: {const: true}
        orchestrator_ready: {const: true}
        enterprise_dlp_ready: {const: true}
        object_worm_ready: {const: true}
        legal_hold_ready: {const: true}
        evidence_ready: {const: true}
    ActionReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, task_id, accepted, execution_pending, ingress_digest, ledger_evidence_ref, ledger_evidence_digest]
      properties:
        schema_version: {const: agenttrust.data-governance-action-receipt.v1}
        action_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        accepted: {const: true}
        execution_pending: {const: true}
        ingress_digest: {$ref: '#/components/schemas/Digest'}
        ledger_evidence_ref: {type: string, pattern: '^evidence://'}
        ledger_evidence_digest: {$ref: '#/components/schemas/Digest'}
    ExecutorRequest:
      type: object
      additionalProperties: false
      required: [schema_version, command, actor_subject, actor_kind, approval_ids]
      properties:
        schema_version: {const: agenttrust.data-governance-execution-request.v1}
        command: {$ref: ../data-governance/data-command.schema.json}
        actor_subject: {type: string, minLength: 1, maxLength: 256}
        actor_kind: {const: WORKLOAD}
        approval_ids:
          type: array
          maxItems: 0
          uniqueItems: true
          items: {type: string, format: uuid}
    MutationResult:
      type: object
      additionalProperties: false
      required: [schema_version, command_id, operation, resource, resource_version, state, result_digest, evidence_outbox_ref, evidence_ref, evidence_digest, safe_receipts]
      properties:
        schema_version: {const: agenttrust.data-governance-mutation-result.v1}
        command_id: {type: string, format: uuid}
        operation: {type: string}
        resource: {type: string}
        resource_version: {type: integer, minimum: 1}
        state: {const: COMPLETED}
        result_digest: {$ref: '#/components/schemas/Digest'}
        evidence_outbox_ref: {type: string, pattern: '^evidence-outbox://'}
        evidence_ref: {type: string, pattern: '^evidence://'}
        evidence_digest: {$ref: '#/components/schemas/Digest'}
        safe_receipts: {type: array, maxItems: 8, items: {type: object}}
    PolicyEvaluationResult:
      type: object
      additionalProperties: false
      required: [schema_version, decision_id, request_digest, decision, decision_digest, durable_record_required, record_payload]
      properties:
        schema_version: {const: agenttrust.data-policy-evaluation.v1}
        decision_id: {type: string, format: uuid}
        request_digest: {$ref: '#/components/schemas/Digest'}
        decision: {type: object}
        decision_digest: {$ref: '#/components/schemas/Digest'}
        durable_record_required: {const: true}
        record_payload: {type: object}
    DlpInspectionResult:
      type: object
      additionalProperties: false
      required: [schema_version, scan_id, content_digest, size_bytes, finding_counts, findings_digest, blocking, engine_revision, engine_receipt_ref, engine_receipt_digest, durable_record_required, record_payload]
      properties:
        schema_version: {const: agenttrust.data-dlp-inspection.v1}
        scan_id: {type: string, format: uuid}
        content_digest: {$ref: '#/components/schemas/Digest'}
        size_bytes: {type: integer, minimum: 1, maximum: 8388608}
        finding_counts: {type: object}
        findings_digest: {$ref: '#/components/schemas/Digest'}
        blocking: {type: boolean}
        engine_revision: {type: string}
        engine_receipt_ref: {type: string}
        engine_receipt_digest: {$ref: '#/components/schemas/Digest'}
        durable_record_required: {const: true}
        record_payload: {type: object}
    PromptSanitizationResult:
      type: object
      additionalProperties: false
      required: [schema_version, transform_id, sanitized_content_base64, input_digest, output_digest, transformations, reversible, dlp_receipt_digest, transform_receipt_digest, durable_record_required, record_payload]
      properties:
        schema_version: {const: agenttrust.prompt-sanitization.v1}
        transform_id: {type: string, format: uuid}
        sanitized_content_base64: {type: string, contentEncoding: base64, maxLength: 11184820}
        input_digest: {$ref: '#/components/schemas/Digest'}
        output_digest: {$ref: '#/components/schemas/Digest'}
        transformations: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string}}
        reversible: {type: boolean}
        dlp_receipt_digest: {$ref: '#/components/schemas/Digest'}
        transform_receipt_digest: {$ref: '#/components/schemas/Digest'}
        durable_record_required: {const: true}
        record_payload: {type: object}
    ArtifactAuthorizationResult:
      type: object
      additionalProperties: false
      required: [schema_version, authorization_id, allowed, durable_preflight_verified, label_digest, decision_id, decision, decision_digest, policy_request_digest, dlp_scan_id, dlp_receipt_digest, transform_id, transform_receipt_digest, object_authorization_ref, object_authorization_digest, worm_required, durable_export_intent_required]
      properties:
        schema_version: {const: agenttrust.artifact-authorization.v1}
        authorization_id: {type: string, format: uuid}
        allowed: {const: true}
        durable_preflight_verified: {const: true}
        label_digest: {$ref: '#/components/schemas/Digest'}
        decision_id: {type: string, format: uuid}
        decision: {type: object}
        decision_digest: {$ref: '#/components/schemas/Digest'}
        policy_request_digest: {$ref: '#/components/schemas/Digest'}
        dlp_scan_id: {type: string, format: uuid}
        dlp_receipt_digest: {$ref: '#/components/schemas/Digest'}
        transform_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: 'null'}
        transform_receipt_digest:
          oneOf:
            - {$ref: '#/components/schemas/Digest'}
            - {type: 'null'}
        object_authorization_ref: {type: string}
        object_authorization_digest: {$ref: '#/components/schemas/Digest'}
        worm_required: {const: true}
        durable_export_intent_required: {const: true}
    AuthoritativeResource:
      type: object
      additionalProperties: false
      required: [resource, resource_version, action_hash, ledger_execution_id, fence_digest, updated_at]
      properties:
        resource: {type: string, minLength: 1, maxLength: 1024, pattern: '^(?!/)(?!.*\.\.)(?!.*//)[^\s]+$'}
        resource_version: {type: integer, minimum: 1}
        action_hash: {$ref: '#/components/schemas/Digest'}
        ledger_execution_id: {type: string, format: uuid}
        fence_digest: {$ref: '#/components/schemas/Digest'}
        updated_at: {type: string, format: date-time}
    AuthoritativePage:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, authoritative, items, next_after, data_digest]
      properties:
        schema_version: {const: agenttrust.authoritative-data-page.v1}
        tenant_id: {type: string, format: uuid}
        authoritative: {const: true}
        items:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/AuthoritativeResource'}
        next_after:
          oneOf:
            - {type: string, minLength: 1, maxLength: 1024, pattern: '^(?!/)(?!.*\.\.)(?!.*//)[^\s]+$'}
            - {type: 'null'}
        data_digest:
          allOf:
            - {$ref: '#/components/schemas/Digest'}
            - {description: JCS SHA-256 of the complete page object with data_digest omitted.}
    Error:
      type: object
      additionalProperties: false
      required: [schema_version, error, trace_id, safe_digest]
      properties:
        schema_version: {const: agenttrust.data-authority-error.v1}
        error: {type: string}
        trace_id: {type: string, format: uuid}
        safe_digest: {$ref: '#/components/schemas/Digest'}
  responses:
    BadRequest:
      description: Invalid bounded request.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: mTLS SAN, tenant, subject, or token scope denied.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Idempotency, state, DLP, legal hold, or cross-domain conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: No mutation is visible for this tenant and command identifier.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: A required authority is unavailable; high-risk flow fails closed.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
