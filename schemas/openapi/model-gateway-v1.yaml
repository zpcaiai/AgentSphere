openapi: 3.1.0
info:
  title: AgentTrust Production Model Gateway
  version: 1.0.0
  description: >-
    Deterministic data-policy filtering, immutable approved model versions, bounded generation,
    streaming and embeddings, durable budget reservation, DLP, policy-enforced data residency,
    governed artifact export and provider billing reconciliation. A provider call with an
    ambiguous outcome never falls back.
servers:
  - url: https://model-gateway.internal:8091
x-agenttrust-binding-parameters: &modelBindingParameters
  - {$ref: '#/components/parameters/TenantId'}
  - {$ref: '#/components/parameters/IdempotencyKey'}
  - {$ref: '#/components/parameters/ActionHash'}
  - {$ref: '#/components/parameters/AuthorizationId'}
  - {$ref: '#/components/parameters/AuthorizationDigest'}
  - {$ref: '#/components/parameters/PolicyDecisionId'}
  - {$ref: '#/components/parameters/PolicyDecisionDigest'}
  - {$ref: '#/components/parameters/AuthorizationEvidenceRef'}
  - {$ref: '#/components/parameters/AuthorizationEvidenceDigest'}
  - {$ref: '#/components/parameters/LedgerExecutionId'}
  - {$ref: '#/components/parameters/LedgerEntryId'}
  - {$ref: '#/components/parameters/LedgerEntryDigest'}
  - {$ref: '#/components/parameters/FenceDigest'}
  - {$ref: '#/components/parameters/ResourceVersion'}
  - {$ref: '#/components/parameters/TraceId'}
paths:
  /ready:
    get:
      operationId: modelGatewayDataReadiness
      security: [{mutualTLS: []}]
      responses:
        '200':
          description: Database, provider registry, Batch 18 data-governance, locked artifact store and Evidence dependencies are ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/models/generate:
    post:
      operationId: generateModelResponse
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *modelBindingParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../model-gateway/model-execution.schema.json#/$defs/request'}
      responses:
        '200':
          description: Newly completed or exact durable replay of a safe response.
          content:
            application/json:
              schema: {$ref: '../model-gateway/model-execution.schema.json#/$defs/result'}
        '400': {$ref: '#/components/responses/Rejected'}
        '401': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/Rejected'}
        '422': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/models/stream:
    post:
      operationId: streamModelResponse
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *modelBindingParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../model-gateway/model-execution.schema.json#/$defs/request'}
      responses:
        '200':
          description: Ordered bounded DLP_VERIFIED_BUFFERED SSE released only after WORM persistence and signed Evidence. Only the terminal event carries usage and Evidence references.
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data line is an exact model-stream-event.v1 JSON object.
        '400': {$ref: '#/components/responses/Rejected'}
        '401': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/Rejected'}
        '422': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/models/embeddings:
    post:
      operationId: createModelEmbedding
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *modelBindingParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../model-gateway/model-execution.schema.json#/$defs/request'}
      responses:
        '200':
          description: Bounded embedding plus signed execution Evidence.
          content:
            application/json:
              schema: {$ref: '../model-gateway/model-execution.schema.json#/$defs/result'}
        '400': {$ref: '#/components/responses/Rejected'}
        '401': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/Rejected'}
        '422': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/models/billing/reconciliations:
    post:
      operationId: reconcileModelProviderBilling
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *modelBindingParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingStatement'}
      responses:
        '200':
          description: Exact reconciliation result; any mismatch remains blocking.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingReconciliation'}
        '400': {$ref: '#/components/responses/Rejected'}
        '401': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/authoritative/models/executions:
    get:
      operationId: listAuthoritativeModelExecutions
      description: >-
        Tenant-scoped keyset page for BFF and operations UI. It exposes only immutable action
        digests, lifecycle state, governed artifact/evidence references and billing metadata;
        raw prompts, generated text, embeddings and stream chunks are never returned.
      security: [{mutualTLS: [], bearerAuth: []}]
      x-required-scope: models:executions:read
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/TraceId'}
        - name: tenant_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - name: state
          in: query
          schema: {type: string, enum: [PREPARED, EXECUTING, SUCCEEDED, FAILED, UNKNOWN]}
        - name: operation
          in: query
          schema: {type: string, enum: [GENERATE, STREAM, EMBEDDINGS]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor_created_at
          in: query
          description: Must be supplied together with cursor_request_id.
          schema: {type: string, format: date-time}
        - name: cursor_request_id
          in: query
          description: Must be supplied together with cursor_created_at.
          schema: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200':
          description: >-
            Authoritative safe execution summaries. data_digest is the JCS SHA-256 of the complete
            response after removing only data_digest, including generated_at; query/filter fields
            that are not present in the response are not part of the digest material.
          content:
            application/json:
              schema: {$ref: '../model-gateway/authoritative-executions.schema.json'}
        '400': {$ref: '#/components/responses/Rejected'}
        '401': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    mutualTLS: {type: mutualTLS}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque-service-token}
  parameters:
    TenantId:
      name: X-AgentTrust-Tenant-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/IdempotencyKey'}
    ActionHash:
      name: X-AgentTrust-Action-Hash
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    AuthorizationId:
      name: X-AgentTrust-Authorization-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    AuthorizationDigest:
      name: X-AgentTrust-Authorization-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    PolicyDecisionId:
      name: X-AgentTrust-Policy-Decision-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:/-]+$'}
    PolicyDecisionDigest:
      name: X-AgentTrust-Policy-Decision-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    AuthorizationEvidenceRef:
      name: X-AgentTrust-Authorization-Evidence-Ref
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 512}
    AuthorizationEvidenceDigest:
      name: X-AgentTrust-Authorization-Evidence-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    LedgerExecutionId:
      name: X-AgentTrust-Ledger-Execution-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    LedgerEntryId:
      name: X-AgentTrust-Ledger-Entry-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    LedgerEntryDigest:
      name: X-AgentTrust-Ledger-Entry-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    FenceDigest:
      name: X-AgentTrust-Fence-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    ResourceVersion:
      name: X-AgentTrust-Resource-Version
      in: header
      required: true
      description: Canonical decimal version of the state-owning model resource bound to this action.
      schema: {type: string, pattern: '^(0|[1-9][0-9]{0,18})$'}
    TraceId:
      name: X-AgentTrust-Trace-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:/-]+$'}
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    IdempotencyKey: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:/-]+$'}
    Readiness:
      type: object
      additionalProperties: false
      required: [schema_version, ready, database_ready, provider_registry_ready, data_governance_authority_ready, artifact_store_ready, evidence_ready]
      properties:
        schema_version: {const: agenttrust.model-gateway-readiness.v1}
        ready: {type: boolean}
        database_ready: {type: boolean}
        provider_registry_ready: {type: boolean}
        data_governance_authority_ready: {type: boolean}
        artifact_store_ready: {type: boolean}
        evidence_ready: {type: boolean}
    BillingLine:
      type: object
      additionalProperties: false
      required: [provider_key, provider_request_id, input_tokens, output_tokens, billed_microunits]
      properties:
        provider_key: {type: string, minLength: 1, maxLength: 768}
        provider_request_id: {type: string, minLength: 1, maxLength: 512}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        billed_microunits: {type: integer, minimum: 0}
    BillingStatement:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, canonical_action, provider_id, statement_period, statement_digest, residency_policy_evidence_digest, lines, provider_attestation]
      properties:
        schema_version: {const: agenttrust.model-billing-statement.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        canonical_action: {$ref: '../json/action.schema.json'}
        provider_id: {type: string, minLength: 1, maxLength: 128}
        statement_period: {type: string, minLength: 1, maxLength: 64}
        statement_digest: {$ref: '#/components/schemas/Digest'}
        residency_policy_evidence_digest:
          allOf: [{$ref: '#/components/schemas/Digest'}]
          description: Digest of the completed Batch 18 policy mutation Evidence that authorized the billed residency path.
        lines: {type: array, minItems: 1, maxItems: 100000, items: {$ref: '#/components/schemas/BillingLine'}}
        provider_attestation: {$ref: '#/components/schemas/ProviderBillingAttestation'}
    ProviderBillingAttestation:
      type: object
      additionalProperties: false
      required: [schema_version, provider_id, statement_period, statement_digest, issued_at, expires_at, issuer, key_id, key_usage, signature]
      properties:
        schema_version: {const: agenttrust.model-provider-billing-attestation.v1}
        provider_id: {type: string, minLength: 1, maxLength: 128}
        statement_period: {type: string, minLength: 1, maxLength: 64}
        statement_digest: {$ref: '#/components/schemas/Digest'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        issuer: {type: string, minLength: 1, maxLength: 256}
        key_id: {type: string, minLength: 1, maxLength: 128}
        key_usage: {const: MODEL_PROVIDER_BILLING}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]+$'}
    BillingReconciliation:
      type: object
      additionalProperties: false
      required: [schema_version, matched, matched_requests, total_metered_microunits, total_billed_microunits, statement_digest, provider_attestation_digest, evidence_ref, evidence_digest]
      properties:
        schema_version: {const: agenttrust.model-billing-reconciliation.v1}
        matched: {type: boolean}
        matched_requests: {type: integer, minimum: 0}
        total_metered_microunits: {type: integer, minimum: 0}
        total_billed_microunits: {type: integer, minimum: 0}
        statement_digest: {$ref: '#/components/schemas/Digest'}
        provider_attestation_digest: {$ref: '#/components/schemas/Digest'}
        evidence_ref: {type: string, minLength: 1, maxLength: 512}
        evidence_digest: {$ref: '#/components/schemas/Digest'}
    Error:
      type: object
      additionalProperties: false
      required: [schema_version, error, trace_id]
      properties:
        schema_version: {const: agenttrust.model-error.v1}
        error: {type: string, pattern: '^MODEL_[A-Z0-9_]+$'}
        trace_id: {type: string, minLength: 1, maxLength: 128}
  responses:
    Rejected:
      description: Fail-closed validation, policy, DLP or authorization rejection.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Idempotency conflict or ambiguous external outcome; the provider call is not replayed.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Mandatory dependency is unavailable; no unsafe fallback is attempted.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
