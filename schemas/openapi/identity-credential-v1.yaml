openapi: 3.1.0
info:
  title: Agent Trust Workload Credential Authority API
  version: 1.0.0
  description: >-
    Production-only, tenant-isolated issuance, single-use consumption and lifecycle authority.
    Every data-plane connection requires TLS 1.3 mutual authentication. Opaque service tokens
    are bound to the exact client certificate SAN, tenant and operation scope.
paths:
  /ready:
    get:
      operationId: identityCredentialDataReadiness
      security: [{mutualTLS: []}]
      responses:
        '200': {$ref: '#/components/responses/Ready'}
        '503': {$ref: '#/components/responses/NotReady'}
  /v1/authoritative/credentials:
    get:
      operationId: listAuthoritativeCredentials
      description: >-
        Tenant-isolated safe projection for the enterprise BFF. Requires the exact
        credentials:read scope. Raw handles, handle hashes, full claims and encrypted
        idempotency responses are never returned.
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - name: resource
          in: query
          schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-z][a-z0-9_-]{0,99}$', default: summary}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Authoritative safe credential inventory
          content:
            application/json:
              schema: {$ref: '../identity/workload-credential.schema.json#/$defs/authoritativeCredentialPage'}
        '400': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Rejected'}
  /v1/credentials/issue:
    post:
      operationId: issueWorkloadCredential
      description: Requires the exact credentials:issue token scope. The raw bearer is returned only as workload_credential.
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../identity/workload-credential.schema.json#/$defs/bindingRequest'}
      responses:
        '200':
          description: Exact issuance response, durably committed and envelope-encrypted before return
          content:
            application/json:
              schema: {$ref: '../identity/workload-credential.schema.json#/$defs/issuance'}
        '400': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Rejected'}
        '410': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Rejected'}
  /v1/credentials/consume:
    post:
      operationId: consumeWorkloadCredential
      description: Requires the exact credentials:consume scope assigned only to the production tool-proxy identity.
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../identity/workload-credential.schema.json#/$defs/consumptionRequest'}
      responses:
        '200':
          description: Signed single-use consumption receipt; a retry with the same request replays this exact receipt
          content:
            application/json:
              schema: {$ref: '../identity/workload-credential.schema.json#/$defs/consumptionReceipt'}
        '400': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '404': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Rejected'}
        '410': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Rejected'}
  '/v1/credentials/{credential_id}/revoke':
    post:
      operationId: revokeCredential
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CredentialId'}
      requestBody: {$ref: '#/components/requestBodies/RequiredReason'}
      responses: &lifecycleResponses
        '200':
          description: Durable lifecycle receipt
          content:
            application/json:
              schema: {$ref: '../identity/workload-credential.schema.json#/$defs/lifecycleReceipt'}
        '400': {$ref: '#/components/responses/Rejected'}
        '403': {$ref: '#/components/responses/Rejected'}
        '404': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Rejected'}
  '/v1/tasks/{task_id}/pause':
    post:
      operationId: pauseTaskCredentialIssuance
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: &taskParameters
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/TaskId'}
      requestBody: {$ref: '#/components/requestBodies/NoReason'}
      responses: *lifecycleResponses
  '/v1/tasks/{task_id}/unfreeze':
    post:
      operationId: unfreezeTaskCredentialIssuance
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *taskParameters
      requestBody: {$ref: '#/components/requestBodies/NoReason'}
      responses: *lifecycleResponses
  '/v1/tasks/{task_id}/revoke':
    post:
      operationId: revokeTaskCredentials
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *taskParameters
      requestBody: {$ref: '#/components/requestBodies/RequiredReason'}
      responses: *lifecycleResponses
  '/v1/tasks/{task_id}/cancel':
    post:
      operationId: cancelTaskAndRevokeCredentials
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *taskParameters
      requestBody: {$ref: '#/components/requestBodies/RequiredReason'}
      responses: *lifecycleResponses
  '/v1/tasks/{task_id}/kill':
    post:
      operationId: killTaskAndRevokeCredentials
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters: *taskParameters
      requestBody: {$ref: '#/components/requestBodies/RequiredReason'}
      responses: *lifecycleResponses
  '/v1/agents/{agent_id}/revoke':
    post:
      operationId: revokeAgentCredentials
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/AgentId'}
      requestBody: {$ref: '#/components/requestBodies/RequiredReason'}
      responses: *lifecycleResponses
  '/v1/tenants/{tenant_id}/revoke':
    post:
      operationId: revokeTenantCredentials
      security: [{mutualTLS: [], bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: tenant_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody: {$ref: '#/components/requestBodies/RequiredReason'}
      responses: *lifecycleResponses
components:
  securitySchemes:
    mutualTLS: {type: mutualTLS}
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: SHA-256-bound service token; never a workload credential or JWT
  parameters:
    TenantId:
      name: X-AgentTrust-Tenant-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:/-]+$'}
      description: Must exactly equal the body idempotency_key for issue and consume
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBodies:
    NoReason:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '../identity/workload-credential.schema.json#/$defs/lifecycleRequest'}
              - type: object
                properties:
                  reason_code: {type: 'null'}
    RequiredReason:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '../identity/workload-credential.schema.json#/$defs/lifecycleRequest'}
              - type: object
                required: [reason_code]
                properties:
                  reason_code: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
  responses:
    Ready:
      description: RLS, grants, signing keys, live credential verification keys and replay keys are ready
      content:
        application/json:
          schema: {$ref: '../identity/workload-credential.schema.json#/$defs/readiness'}
    NotReady:
      description: At least one fail-closed readiness condition is false
      content:
        application/json:
          schema: {$ref: '../identity/workload-credential.schema.json#/$defs/readiness'}
    Rejected:
      description: Request rejected without secret disclosure
      content:
        application/json:
          schema: {$ref: '../identity/workload-credential.schema.json#/$defs/error'}
