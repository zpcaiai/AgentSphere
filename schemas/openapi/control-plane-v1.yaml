        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    GovernedProjectRequest:
      type: object
      additionalProperties: false
      required: [project, intent, reason]
      properties:
        project: {$ref: '#/components/schemas/ProjectRequest'}
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    GovernedIntegrationRequest:
      type: object
      additionalProperties: false
      required: [integration, intent, reason]
      properties:
        integration: {$ref: '#/components/schemas/IntegrationRequest'}
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    GovernedQuotaRequest:
      type: object
      additionalProperties: false
      required: [quota, intent, reason]
      properties:
        quota: {$ref: '#/components/schemas/QuotaConsumeRequest'}
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    GovernedCostRequest:
      type: object
      additionalProperties: false
      required: [cost, intent, reason]
      properties:
        cost: {$ref: '#/components/schemas/CostUsageRequest'}
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    GovernedApiKeyIssueRequest:
