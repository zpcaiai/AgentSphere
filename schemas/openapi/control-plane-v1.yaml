        sponsor_subject: {type: string, minLength: 1, maxLength: 512}
        ownership_status: {enum: [PENDING, CONFIRMED]}
        environment: {enum: [DEVELOPMENT, STAGING, PRODUCTION]}
        lifecycle: {enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED, REVOKED]}
        agent_type: {type: string, minLength: 1, maxLength: 128}
        bom_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        endpoint_count: {type: integer, minimum: 1, maximum: 100}
        identity_count: {type: integer, minimum: 1, maximum: 1000}
        tool_count: {type: integer, minimum: 0, maximum: 1000}
        pack_count: {type: integer, minimum: 0, maximum: 1000}
        open_findings: {type: integer, minimum: 0}
        highest_risk: {type: [string, 'null'], enum: [LOW, MEDIUM, HIGH, CRITICAL, null]}
        last_activity_at: {type: string, format: date-time}
        registered_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentInventoryPage:
      type: object
      additionalProperties: false
      required: [schema_version, authoritative, tenant_id, resource, items, next_cursor, data_digest]
      properties:
        schema_version: {const: agenttrust.authoritative-agent-page.v1}
        authoritative: {const: true}
        tenant_id: {type: string, format: uuid}
        resource: {const: summary}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentInventoryItem'}}
        next_cursor: {type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{1,5462}$'}
        data_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    AuthoritySection:
      type: object
      additionalProperties: false
      required: [schema_version, section, authoritative, available, data, data_digest, fetched_at]
      properties:
        schema_version: {const: agenttrust.authority-view.v1}
        section:
          enum: [TASKS, INCIDENTS, AGENTS, TOOLS, CREDENTIALS, APPROVALS, POLICIES, PACKS,
            TRACE, EVIDENCE, COMPLIANCE, AUDIT, MODELS, DATA, CONTEXT, ANOMALIES,
            SECURITY_EVALUATIONS, SUPPLY_CHAIN, DOMAIN_PACKS, SRE, DEPLOYMENTS]
        authoritative: {const: true}
        available: {type: boolean}
        data:
          oneOf:
            - {$ref: '#/components/schemas/AuthorityPayload'}
            - {type: array, maxItems: 1000, items: {}}
            - {type: 'null'}
        data_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        safe_error_code: {enum: [AUTHORITATIVE_SOURCE_UNAVAILABLE]}
        fetched_at: {type: string, format: date-time}
    EnterpriseDashboard:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, sections, complete, unavailable_sections, generated_at]
      properties:
        schema_version: {const: agenttrust.enterprise-dashboard.v1}
        tenant_id: {type: string, format: uuid}
        sections:
          type: object
          additionalProperties: false
          required: [TASKS, INCIDENTS, AGENTS, TOOLS, CREDENTIALS, APPROVALS, POLICIES, PACKS,
            TRACE, EVIDENCE, COMPLIANCE, AUDIT, MODELS, DATA, CONTEXT, ANOMALIES,
            SECURITY_EVALUATIONS, SUPPLY_CHAIN, DOMAIN_PACKS, SRE, DEPLOYMENTS]
          properties:
            TASKS: {$ref: '#/components/schemas/AuthoritySection'}
            INCIDENTS: {$ref: '#/components/schemas/AuthoritySection'}
            AGENTS: {$ref: '#/components/schemas/AuthoritySection'}
            TOOLS: {$ref: '#/components/schemas/AuthoritySection'}
            CREDENTIALS: {$ref: '#/components/schemas/AuthoritySection'}
            APPROVALS: {$ref: '#/components/schemas/AuthoritySection'}
            POLICIES: {$ref: '#/components/schemas/AuthoritySection'}
            PACKS: {$ref: '#/components/schemas/AuthoritySection'}
            TRACE: {$ref: '#/components/schemas/AuthoritySection'}
            EVIDENCE: {$ref: '#/components/schemas/AuthoritySection'}
            COMPLIANCE: {$ref: '#/components/schemas/AuthoritySection'}
            AUDIT: {$ref: '#/components/schemas/AuthoritySection'}
            MODELS: {$ref: '#/components/schemas/AuthoritySection'}
            DATA: {$ref: '#/components/schemas/AuthoritySection'}
            CONTEXT: {$ref: '#/components/schemas/AuthoritySection'}
            ANOMALIES: {$ref: '#/components/schemas/AuthoritySection'}
            SECURITY_EVALUATIONS: {$ref: '#/components/schemas/AuthoritySection'}
            SUPPLY_CHAIN: {$ref: '#/components/schemas/AuthoritySection'}
            DOMAIN_PACKS: {$ref: '#/components/schemas/AuthoritySection'}
            SRE: {$ref: '#/components/schemas/AuthoritySection'}
            DEPLOYMENTS: {$ref: '#/components/schemas/AuthoritySection'}
        complete: {type: boolean}
        unavailable_sections:
          type: array
          uniqueItems: true
          items:
            enum: [TASKS, INCIDENTS, AGENTS, TOOLS, CREDENTIALS, APPROVALS, POLICIES, PACKS,
              TRACE, EVIDENCE, COMPLIANCE, AUDIT, MODELS, DATA, CONTEXT, ANOMALIES,
              SECURITY_EVALUATIONS, SUPPLY_CHAIN, DOMAIN_PACKS, SRE, DEPLOYMENTS]
        generated_at: {type: string, format: date-time}
    AguiEvent:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, tenant_id, task_id, sequence, trace_id, kind, safe_payload, occurred_at, backend_signature]
      properties:
        schema_version: {const: agenttrust.a2a-agui.v1}
        event_id: {type: string, minLength: 1, maxLength: 200}
        tenant_id: {type: string, format: uuid}
        task_id: {type: string, minLength: 1, maxLength: 200}
        sequence: {type: integer, minimum: 1}
        trace_id: {type: string, minLength: 1, maxLength: 256}
        kind: {enum: [PLAN_UPDATED, TOOL_REQUESTED, APPROVAL_REQUIRED, APPROVAL_RECORDED, EXECUTION_STATUS, ARTIFACT_AVAILABLE, EVALUATION_UPDATED, INCIDENT]}
        safe_payload: {type: object, maxProperties: 256, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
        backend_signature: {type: string, minLength: 16, maxLength: 4096}
    AguiResumeResponse:
      type: object
      additionalProperties: false
      required: [events, next_resume_token, safe_snapshot_required]
      properties:
        events: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AguiEvent'}}
        next_resume_token: {type: string, maxLength: 2048}
        safe_snapshot_required: {type: boolean}
    AguiSafeSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, task_id, sequence, safe_state, next_resume_token, generated_at, backend_signature]
      properties:
        schema_version: {const: agenttrust.agui-safe-snapshot.v1}
        tenant_id: {type: string, format: uuid}
        task_id: {type: string, minLength: 1, maxLength: 200}
        sequence: {type: integer, minimum: 0}
        safe_state:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
            evidence_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
            occurred_at: {type: string, format: date-time}
        next_resume_token: {type: string, minLength: 1, maxLength: 2048}
        generated_at: {type: string, format: date-time}
        backend_signature: {type: string, minLength: 16, maxLength: 4096}
    AdminAction:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, tenant_id, project_id, operation, resource, requested_by, approval_ids, action_digest, requested_at]
      properties:
        schema_version: {const: agenttrust.enterprise-control.v1}
        action_id: {type: string, minLength: 1}
        tenant_id: {type: string, format: uuid}
        project_id: {type: [string, 'null']}
        operation: {type: string, minLength: 1}
        resource: {type: string, minLength: 1}
        requested_by: {type: string, minLength: 1}
        approval_ids: {type: array, maxItems: 16, uniqueItems: true, items: {type: string}}
        action_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the canonical action binding, excluding this field and including reason plus the governed request payload.
        requested_at: {type: string, format: date-time}
    GovernedAdminIntent:
      type: object
      additionalProperties: false
      required: [intent, reason]
      properties:
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    QuotaSpec:
      type: object
      additionalProperties: false
      required: [maximum_active_tasks, maximum_export_records, maximum_webhooks, maximum_api_requests_per_minute]
      properties:
        maximum_active_tasks: {type: integer, minimum: 1}
        maximum_export_records: {type: integer, minimum: 1}
        maximum_webhooks: {type: integer, minimum: 1}
        maximum_api_requests_per_minute: {type: integer, minimum: 1}
    TenantRequest:
      type: object
      additionalProperties: false
      required: [display_name, owner_subject, data_region, quota]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 200}
        owner_subject: {type: string, minLength: 1, maxLength: 300}
        data_region: {type: string, pattern: '^[A-Z]{2}(-[A-Z0-9]{1,8})?$'}
        quota: {$ref: '#/components/schemas/QuotaSpec'}
    OrganizationRequest:
      type: object
      additionalProperties: false
      required: [organization_id, display_name, sponsor_subject]
      properties:
        organization_id: {type: string, minLength: 1, maxLength: 200}
        display_name: {type: string, minLength: 1, maxLength: 200}
        sponsor_subject: {type: string, minLength: 1, maxLength: 300}
    ProjectRequest:
      type: object
      additionalProperties: false
      required: [project_id, organization_id, owner_subject, environments]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 200}
        organization_id: {type: string, minLength: 1, maxLength: 200}
        owner_subject: {type: string, minLength: 1, maxLength: 300}
        environments: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}
    IntegrationRequest:
      type: object
      additionalProperties: false
      required: [integration_id, kind, endpoint, secret_ref, configuration_digest, active]
      properties:
        integration_id: {type: string, format: uuid}
        kind: {enum: [IAM, NOTIFICATION, TICKETING, SIEM, WEBHOOK]}
        endpoint: {type: string, format: uri, pattern: '^https://'}
        secret_ref:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '^(credential://[A-Za-z0-9._:/-]{1,900}|vault-kv://[A-Za-z0-9._/-]{1,900}#v[1-9][0-9]*)$'
        configuration_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        active: {type: boolean}
    QuotaConsumeRequest:
      type: object
      additionalProperties: false
      required: [quota_key, window_started_at, amount, limit]
      properties:
        quota_key: {type: string, minLength: 1, maxLength: 100}
        window_started_at: {type: string, format: date-time}
        amount: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1}
    QuotaUsage:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, quota_key, window_started_at, used, limit]
      properties:
        schema_version: {const: agenttrust.quota-usage.v1}
        tenant_id: {type: string, format: uuid}
        quota_key: {type: string}
        window_started_at: {type: string, format: date-time}
        used: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1}
    CostUsageRequest:
      type: object
      additionalProperties: false
      required: [usage_id, project_id, meter, quantity, unit_cost_micros, source_digest, recorded_at]
      properties:
        usage_id: {type: string, format: uuid}
        project_id: {type: string, minLength: 1, maxLength: 200}
        meter: {type: string, minLength: 1, maxLength: 100}
        quantity: {type: integer, minimum: 1}
        unit_cost_micros: {type: integer, minimum: 0}
        source_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        recorded_at: {type: string, format: date-time}
    ApiKeyIssueRequest:
      type: object
      additionalProperties: false
      required: [project_id, scopes, expires_at]
      properties:
        project_id: {type: [string, 'null']}
        scopes: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9:_-]{0,99}$'}}
        expires_at: {type: string, format: date-time}
    EnterpriseActionReceipt:
      type: object
      additionalProperties: false
      description: Durable workflow admission only; final success requires authoritative task evidence.
      required: [schema_version, action_id, task_id, accepted, start_requested, execution_pending, ingress_digest, evidence_ref, evidence_digest]
      properties:
        schema_version: {const: agenttrust.enterprise-action-receipt.v1}
        action_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        accepted: {const: true}
        start_requested: {const: true}
        execution_pending: {const: true}
        ingress_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        evidence_ref: {type: string, pattern: '^orchestrator-event://[0-9a-f-]{36}/[0-9a-f-]{36}/[1-9][0-9]*$'}
        evidence_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    GovernedTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant, intent, reason]
      properties:
        tenant: {$ref: '#/components/schemas/TenantRequest'}
