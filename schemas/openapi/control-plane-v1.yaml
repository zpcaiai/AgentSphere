openapi: 3.1.0
info:
  title: Agent Trust Control Plane API
  version: 1.0.0
servers:
  - url: https://control.invalid/v1
    description: Placeholder only; deployment supplies an approved endpoint.
security:
  - workloadIdentity: []
x-policy-artifact-responses: &policyArtifactResponses
  '200':
    description: Bounded tenant and Policy-bound authoritative lifecycle artifacts
    content: {application/json: {schema: {$ref: '#/components/schemas/PolicyArtifactPage'}}}
paths:
  /session:
    get:
      operationId: getConsoleSession
      security:
        - enterpriseJwt: []
        - oidcSession: []
      responses:
        '200':
          description: Tenant-bound server-side console session and CSRF binding
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsoleSession'}}}
  /session/logout:
    post:
      operationId: logoutConsoleSession
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Server-side session invalidated and browser cookies expired}
  /tenants/{tenantId}:
    post:
      operationId: createTenant
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedTenantRequest'}
      responses:
        '202':
          description: Canonical action durably accepted; execution and task completion are pending
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: 'Tenant, role, CSRF, action binding, or separation-of-duties denial'}
  /tenants/{tenantId}/organizations:
    post:
      operationId: createOrganization
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedOrganizationRequest'}
      responses:
        '202':
          description: Canonical action durably accepted; execution and task completion are pending
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/projects:
    post:
      operationId: createProject
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedProjectRequest'}
      responses:
        '202':
          description: Canonical action durably accepted; execution and task completion are pending
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/integrations:
    post:
      operationId: createIntegration
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedIntegrationRequest'}
      responses:
        '202':
          description: Canonical action durably accepted; execution and task completion are pending
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: Authorization or endpoint validation denied}
  /tenants/{tenantId}/quota/consume:
    post:
      operationId: consumeTenantQuota
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedQuotaRequest'}
      responses:
        '202':
          description: Canonical quota action accepted; usage is not returned before execution
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: Authorization denied or quota exceeded}
  /tenants/{tenantId}/costs:
    post:
      operationId: recordTenantCost
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedCostRequest'}
      responses:
        '202':
          description: Canonical cost action durably accepted; execution is pending
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: Authorization or project scope denied}
  /tenants/{tenantId}/api-keys:
    post:
      operationId: issueApiKey
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedApiKeyIssueRequest'}
      responses:
        '202':
          description: >-
            Canonical credential action accepted. No raw secret is returned; the executor writes it
            once to the governed credential authority and exposes only a protected reference in
            downstream task evidence.
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/api-keys/{apiKeyId}/revoke:
    post:
      operationId: revokeApiKey
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: apiKeyId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedAdminIntent'}
      responses:
        '202':
          description: Canonical revocation action durably accepted; execution is pending
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/tasks/{taskId}/commands:
    post:
      operationId: submitTaskCommand
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedTaskCommand'}
      responses:
        '202':
          description: >-
            Command durably accepted after the exact orchestrator receipt and remote evidence
            reference are verified. Process execution remains pending and is not claimed here;
            completed idempotent replays return the same status without redispatch.
        '409': {description: State version conflict or duplicate content mismatch}
        '429': {description: Bounded queue full}
        '503': {description: 'Acceptance is unverified, still in progress, or outcome remains UNKNOWN'}
  /tenants/{tenantId}/agents:
    get:
      operationId: listAgentInventory
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: cursor, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,5462}$'}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Tenant-scoped authoritative inventory page
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentInventoryPage'}}}
  /tenants/{tenantId}/policies:
    get:
      operationId: listPolicies
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: after_policy_id, in: query, schema: {$ref: '#/components/schemas/PolicyId'}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Keyset-paginated tenant Policy lifecycle authority
          content: {application/json: {schema: {$ref: '#/components/schemas/PolicyPage'}}}
  /tenants/{tenantId}/policies/{policyId}/sources:
    get:
      operationId: listPolicySources
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/PolicyId'}, {$ref: '#/components/parameters/PolicyArtifactLimit'}]
      responses: *policyArtifactResponses
  /tenants/{tenantId}/policies/{policyId}/analyses:
    get:
      operationId: listPolicyAnalyses
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/PolicyId'}, {$ref: '#/components/parameters/PolicyArtifactLimit'}]
      responses: *policyArtifactResponses
  /tenants/{tenantId}/policies/{policyId}/reviews:
    get:
      operationId: listPolicyReviews
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/PolicyId'}, {$ref: '#/components/parameters/PolicyArtifactLimit'}]
      responses: *policyArtifactResponses
  /tenants/{tenantId}/policies/{policyId}/simulations:
    get:
      operationId: listPolicySimulations
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/PolicyId'}, {$ref: '#/components/parameters/PolicyArtifactLimit'}]
      responses: *policyArtifactResponses
  /tenants/{tenantId}/policies/{policyId}/impact-reports:
    get:
      operationId: listPolicyImpactReports
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/PolicyId'}, {$ref: '#/components/parameters/PolicyArtifactLimit'}]
      responses: *policyArtifactResponses
  /tenants/{tenantId}/policies/{policyId}/promotions:
    get:
      operationId: listPolicyPromotions
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/PolicyId'}, {$ref: '#/components/parameters/PolicyArtifactLimit'}]
      responses: *policyArtifactResponses
  /tenants/{tenantId}/policies/{policyId}/exceptions:
    get:
      operationId: listPolicyExceptions
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/PolicyId'}, {$ref: '#/components/parameters/PolicyArtifactLimit'}]
      responses: *policyArtifactResponses
  /tenants/{tenantId}/policies/actions:
    post:
      operationId: submitPolicyAction
      description: >-
        Forwards an exact strong-auth human assertion to the policy:mutate Canonical Action
        ingress. HTTP 202 proves durable workflow admission only; lifecycle execution is pending.
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PolicyCommand'}}}
      responses:
        '202':
          description: Canonical Policy workflow durably accepted; execution remains pending
          content: {application/json: {schema: {$ref: '#/components/schemas/PolicyActionReceipt'}}}
        '403': {description: 'Tenant, role, strong-auth, request binding, or SoD denial'}
        '409': {description: Idempotency or resource-version conflict}
        '503': {description: Admission outcome is not verifiable; retry only the exact same request and key}
  /tenants/{tenantId}/incidents:
    get:
      operationId: listIncidents
      description: Tenant-isolated authoritative incident lifecycle and ordered evidence timeline.
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: after_incident_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Keyset-paginated authoritative incidents
          content: {application/json: {schema: {$ref: '#/components/schemas/IncidentPage'}}}
        '503': {description: Incident authority or PEP unavailable; no cached success is returned}
  /tenants/{tenantId}/incidents/{incidentId}:
    get:
      operationId: getIncident
      description: One tenant-bound incident and its complete ordered evidence timeline.
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: incidentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Authoritative incident detail
          content: {application/json: {schema: {$ref: '#/components/schemas/Incident'}}}
        '403': {description: Tenant or query authorization denied without cross-tenant disclosure}
        '503': {description: Incident authority or PEP unavailable}
  /tenants/{tenantId}/incidents/actions:
    post:
      operationId: submitIncidentAction
      description: >-
        Forwards a strong-auth human action to the incident:mutate Canonical Action ingress.
        HTTP 202 proves durable admission only; containment, replay, remediation, release-gate,
        canary, rollback and close execution remain pending.
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IncidentCommand'}}}
      responses:
        '202':
          description: Canonical incident/release workflow admitted; execution remains pending
          content: {application/json: {schema: {$ref: '#/components/schemas/IncidentActionReceipt'}}}
        '403': {description: 'Tenant, strong-auth, role, approval, replay boundary or binding denied'}
        '409': {description: 'Idempotency, resource-version, state, approval or evidence conflict'}
        '503': {description: Admission outcome is not verifiable; retry the exact request and key}
  /tenants/{tenantId}/packs:
    get:
      operationId: listPacks
      description: >-
        Tenant catalog and installation lifecycle from the Pack Marketplace authority. Installation
        does not imply activation, and ACTIVE does not imply per-task production authorization.
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: query, in: query, schema: {type: string, maxLength: 128}}
        - {name: after_pack_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9._:/@-]{1,128}$'}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Digest-bound authoritative Pack catalog and tenant activation state
          content: {application/json: {schema: {$ref: '#/components/schemas/PackPage'}}}
        '503': {description: Pack authority or PEP unavailable; no cached success is returned}
  /tenants/{tenantId}/packs/actions:
    post:
      operationId: submitPackAction
      description: >-
        Forwards one of 16 strict lifecycle commands to the packs:mutate Canonical Action ingress.
        HTTP 202 is admission evidence only and never claims publication, installation, activation,
        upgrade, rollback, deactivation or revocation completion.
      security: [{enterpriseJwt: []}, {oidcSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceCommand'}}}
      responses:
        '202':
          description: Canonical Pack workflow admitted; execution and lifecycle state remain pending
          content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceActionReceipt'}}}
        '403': {description: 'Tenant, strong-auth, role, publisher, approval or binding denied'}
        '409': {description: 'Idempotency, resource-version, state, trust or compatibility conflict'}
        '503': {description: Admission outcome is not verifiable; retry the exact request and key}
  /tenants/{tenantId}/approvals/{caseId}/intents:
    post:
      operationId: submitApprovalIntent
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalIntentEnvelope'}
      responses:
        '202':
          description: >-
            Intent accepted only after an independently verified immutable Evidence authority
            receipt. A mutable ApprovalCase decision response alone never produces this status.
        '403': {description: 'Approver authorization, binding, or SoD denial'}
        '503':
          description: >-
            Approval outcome remains UNKNOWN and the same Idempotency-Key is safe to retry. This
            includes CONTROL_APPROVAL_EVIDENCE_PENDING after the remote authority accepted the
            decision but did not return an immutable evidence receipt.
  /tenants/{tenantId}/tasks/{taskId}/agui/events:
    get:
      operationId: resumeTaskEvents
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TaskId'
        - {name: resume_token, in: query, schema: {type: string, maxLength: 2048}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Bounded signed AG-UI resume page
          content: {application/json: {schema: {$ref: '#/components/schemas/AguiResumeResponse'}}}
  /tenants/{tenantId}/tasks/{taskId}/agui/snapshot:
    get:
      operationId: getTaskSafeSnapshot
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Signed tenant/task-bound safe snapshot and resume cursor
          content: {application/json: {schema: {$ref: '#/components/schemas/AguiSafeSnapshot'}}}
        '403': {description: 'Tenant, task ownership, or query authorization denied'}
  /tenants/{tenantId}/dashboard:
    get:
      operationId: getEnterpriseDashboard
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: resource
          in: query
          description: >-
            Bounded view selector forwarded only as a query value to each allowlisted
            authority-specific collection route; it is never interpolated into a path.
          schema: {type: string, default: summary, minLength: 1, maxLength: 100, pattern: '^[a-z][a-z0-9_-]{0,99}$'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Partial-failure-explicit authoritative dashboard
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseDashboard'}}}
  /tenants/{tenantId}/admin/actions:
    post:
      operationId: submitAdminIntent
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedAdminIntent'}
      responses:
        '202':
          description: Canonical action durably accepted; this is not execution success or completion
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}}}
        '403': {description: 'Tenant, RBAC/ABAC, CSRF, or separation-of-duties denial'}
components:
  securitySchemes:
    workloadIdentity:
      type: mutualTLS
    enterpriseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcSession:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    TenantId: {name: tenantId, in: path, required: true, schema: {type: string, minLength: 1}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
    PolicyId: {name: policyId, in: path, required: true, schema: {$ref: '#/components/schemas/PolicyId'}}
    PolicyArtifactLimit: {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._:-]{16,128}$'}}
    CsrfToken: {name: X-XSRF-TOKEN, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
  schemas:
    ConsoleSession:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, subject, roles, project_ids, approval_ids,
        owned_resources, strong_auth, authentication_time, authentication_context,
        csrf_header_name, csrf_token]
      properties:
        schema_version: {const: agenttrust.enterprise-session.v1}
        tenant_id: {type: string, format: uuid}
        subject: {type: string, minLength: 1, maxLength: 300}
        roles: {type: array, maxItems: 64, items: {type: string, maxLength: 100}}
        project_ids: {type: array, maxItems: 1000, items: {type: string, maxLength: 200}}
        approval_ids: {type: array, maxItems: 16, items: {type: string, maxLength: 200}}
        owned_resources:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 2048}
        strong_auth:
          type: boolean
          description: >-
            True only when the verified IdP ACR is allowlisted and auth_time is within the
            configured maximum age. Roles and browser state never imply this value.
        authentication_time:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        authentication_context:
          oneOf: [{type: string, minLength: 1, maxLength: 256}, {type: 'null'}]
        csrf_header_name: {const: X-XSRF-TOKEN}
        csrf_token: {type: string, minLength: 1, maxLength: 4096}
    TaskCommand:
      type: object
      additionalProperties: false
      required: [schema_version, command_id, command_type, expected_state_version, payload_digest]
      properties:
        schema_version: {const: agenttrust.orchestrator-command.v1}
        command_id: {type: string, minLength: 1}
        command_type: {enum: [START, PAUSE, RESUME, CANCEL, KILL, CHECKPOINT]}
        expected_state_version: {type: integer, minimum: 0}
        payload_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    GovernedTaskCommand:
      type: object
      additionalProperties: false
      required: [command, intent, reason]
      properties:
        command: {$ref: '#/components/schemas/TaskCommand'}
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    PolicyId: {type: string, pattern: '^[A-Za-z0-9._:/-]{1,256}$'}
    PolicyDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
    PolicyEnvironment: {enum: [DEV, STAGING, CANARY, PRODUCTION]}
    PolicyRisk: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    PolicyRule:
      type: object
      additionalProperties: false
      required: [rule_id, subject_pattern, tool_pattern, resource_pattern, decision, maximum_risk, reason_code]
      properties:
        rule_id: {type: string, minLength: 1, maxLength: 256}
        subject_pattern: {type: string, minLength: 1, maxLength: 1024}
        tool_pattern: {type: string, minLength: 1, maxLength: 1024}
        resource_pattern: {type: string, minLength: 1, maxLength: 2048}
        decision: {enum: [ALLOW, DENY, KILL, PAUSE, REQUIRE_APPROVAL]}
        maximum_risk: {$ref: '#/components/schemas/PolicyRisk'}
        reason_code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$'}
    PolicySource:
      type: object
      additionalProperties: false
      required: [schema_version, source_id, tenant_id, version, rules, default_decision, author, source_digest, created_at]
