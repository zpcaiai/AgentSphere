openapi: 3.1.0
info:
  title: Agent Trust Control Plane API
  version: 1.0.0
servers:
  - url: https://control.invalid/v1
    description: Placeholder only; deployment supplies an approved endpoint.
security:
  - workloadIdentity: []
paths:
  /session:
    get:
      operationId: getConsoleSession
      security:
        - enterpriseJwt: []
        - oidcSession: []
      responses:
        '200':
          description: Tenant-bound server-side console session and CSRF binding
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsoleSession'}}}
  /session/logout:
    post:
      operationId: logoutConsoleSession
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Server-side session invalidated and browser cookies expired}
  /tenants/{tenantId}:
    post:
      operationId: createTenant
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedTenantRequest'}
      responses:
        '201': {description: Tenant created after PEP authorization and audit persistence}
        '403': {description: Tenant, role, CSRF, action binding, or separation-of-duties denial}
  /tenants/{tenantId}/organizations:
    post:
      operationId: createOrganization
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedOrganizationRequest'}
      responses:
        '201': {description: Organization created and audited}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/projects:
    post:
      operationId: createProject
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedProjectRequest'}
      responses:
        '201': {description: Project and bounded environment set created and audited}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/integrations:
    post:
      operationId: createIntegration
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedIntegrationRequest'}
      responses:
        '201': {description: HTTPS integration configuration created and audited}
        '403': {description: Authorization or endpoint validation denied}
  /tenants/{tenantId}/quota/consume:
    post:
      operationId: consumeTenantQuota
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedQuotaRequest'}
      responses:
        '200':
          description: Atomic quota consumption result
          content: {application/json: {schema: {$ref: '#/components/schemas/QuotaUsage'}}}
        '403': {description: Authorization denied or quota exceeded}
  /tenants/{tenantId}/costs:
    post:
      operationId: recordTenantCost
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedCostRequest'}
      responses:
        '202': {description: Cost usage recorded and audited}
        '403': {description: Authorization or project scope denied}
  /tenants/{tenantId}/api-keys:
    post:
      operationId: issueApiKey
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedApiKeyIssueRequest'}
      responses:
        '201':
          description: One-time API key secret; response is non-cacheable
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyIssueResponse'}}}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/api-keys/{apiKeyId}/revoke:
    post:
      operationId: revokeApiKey
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: apiKeyId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedAdminIntent'}
      responses:
        '204': {description: API key revoked and audited}
        '403': {description: Authorization denied}
  /tenants/{tenantId}/tasks/{taskId}/commands:
    post:
      operationId: submitTaskCommand
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedTaskCommand'}
      responses:
        '202':
          description: >-
            Command durably accepted after the exact orchestrator receipt and remote evidence
            reference are verified. Process execution remains pending and is not claimed here;
            completed idempotent replays return the same status without redispatch.
        '409': {description: State version conflict or duplicate content mismatch}
        '429': {description: Bounded queue full}
        '503': {description: Acceptance is unverified, still in progress, or outcome remains UNKNOWN}
  /tenants/{tenantId}/agents:
    get:
      operationId: listAgentInventory
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Tenant-scoped authoritative inventory page
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthorityPayload'}}}
  /tenants/{tenantId}/policies/{bundleId}/simulate:
    post:
      operationId: simulatePolicyBundle
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: bundleId, in: path, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicySimulationRequest'}
      responses:
        '200':
          description: Side-effect-free impact report
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthorityPayload'}}}
  /tenants/{tenantId}/policies/{bundleId}/promotions:
    post:
      operationId: promotePolicyBundle
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: bundleId, in: path, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedPolicyPromotion'}
      responses:
        '202': {description: Governed promotion dispatched to the authoritative policy service}
        '403': {description: Authorization or separation-of-duties denial}
        '503': {description: Outcome remains UNKNOWN and safe to retry with the same key}
  /tenants/{tenantId}/approvals/{caseId}/intents:
    post:
      operationId: submitApprovalIntent
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalIntentEnvelope'}
      responses:
        '202': {description: Intent accepted only after a verified backend approval event}
        '403': {description: Approver authorization, binding, or SoD denial}
        '503': {description: Approval outcome remains UNKNOWN}
  /tenants/{tenantId}/tasks/{taskId}/agui/events:
    get:
      operationId: resumeTaskEvents
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TaskId'
        - {name: resume_token, in: query, schema: {type: string, maxLength: 2048}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Bounded signed AG-UI resume page
          content: {application/json: {schema: {$ref: '#/components/schemas/AguiResumeResponse'}}}
  /tenants/{tenantId}/tasks/{taskId}/agui/snapshot:
    get:
      operationId: getTaskSafeSnapshot
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Signed tenant/task-bound safe snapshot and resume cursor
          content: {application/json: {schema: {$ref: '#/components/schemas/AguiSafeSnapshot'}}}
        '403': {description: Tenant, task ownership, or query authorization denied}
  /tenants/{tenantId}/dashboard:
    get:
      operationId: getEnterpriseDashboard
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: resource
          in: query
          description: >-
            Bounded view selector forwarded only as a query value to each allowlisted
            authority-specific collection route; it is never interpolated into a path.
          schema: {type: string, default: summary, minLength: 1, maxLength: 100, pattern: '^[a-z][a-z0-9_-]{0,99}$'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Partial-failure-explicit authoritative dashboard
          content: {application/json: {schema: {$ref: '#/components/schemas/EnterpriseDashboard'}}}
  /tenants/{tenantId}/admin/actions:
    post:
      operationId: submitAdminIntent
      security:
        - enterpriseJwt: []
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GovernedAdminIntent'}
      responses:
        '202': {description: Intent accepted; this is not authorization}
        '403': {description: Tenant, RBAC/ABAC, CSRF, or separation-of-duties denial}
components:
  securitySchemes:
    workloadIdentity:
      type: mutualTLS
    enterpriseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcSession:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    TenantId: {name: tenantId, in: path, required: true, schema: {type: string, minLength: 1}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    CsrfToken: {name: X-XSRF-TOKEN, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
  schemas:
    ConsoleSession:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, subject, roles, project_ids, approval_ids,
        csrf_header_name, csrf_token]
      properties:
        schema_version: {const: agenttrust.enterprise-session.v1}
        tenant_id: {type: string, format: uuid}
        subject: {type: string, minLength: 1, maxLength: 300}
        roles: {type: array, maxItems: 64, items: {type: string, maxLength: 100}}
        project_ids: {type: array, maxItems: 1000, items: {type: string, maxLength: 200}}
        approval_ids: {type: array, maxItems: 16, items: {type: string, maxLength: 200}}
        csrf_header_name: {const: X-XSRF-TOKEN}
        csrf_token: {type: string, minLength: 1, maxLength: 4096}
    TaskCommand:
      type: object
      additionalProperties: false
      required: [schema_version, command_id, command_type, expected_state_version, payload_digest]
      properties:
        schema_version: {const: agenttrust.orchestrator-command.v1}
        command_id: {type: string, minLength: 1}
        command_type: {enum: [START, PAUSE, RESUME, CANCEL, KILL, CHECKPOINT]}
        expected_state_version: {type: integer, minimum: 0}
        payload_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    GovernedTaskCommand:
      type: object
      additionalProperties: false
      required: [command, intent, reason]
      properties:
        command: {$ref: '#/components/schemas/TaskCommand'}
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    PolicySimulationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, candidate_digest, corpus_digest, maximum_cases]
      properties:
        schema_version: {const: agenttrust.policy-simulation-request.v1}
        candidate_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        corpus_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        maximum_cases: {type: integer, minimum: 1, maximum: 10000}
    PolicyPromotionRequest:
      type: object
      additionalProperties: false
      required: [schema_version, bundle_version, impact_report_digest, environment]
      properties:
        schema_version: {const: agenttrust.policy-promotion-request.v1}
        bundle_version: {type: string, minLength: 1, maxLength: 200}
        impact_report_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        environment: {enum: [CANARY, PRODUCTION]}
    GovernedPolicyPromotion:
      type: object
      additionalProperties: false
      required: [promotion, intent, reason]
      properties:
        promotion: {$ref: '#/components/schemas/PolicyPromotionRequest'}
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    ApprovalIntent:
      type: object
      additionalProperties: false
      required: [schema_version, case_id, decision, reason, observed_action_hash, observed_resource_version]
      properties:
        schema_version: {const: agenttrust.approval-intent.v1}
        case_id: {type: string, format: uuid}
        decision: {enum: [APPROVE, REJECT]}
        reason: {type: string, minLength: 1, maxLength: 2000}
        observed_action_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        observed_resource_version: {type: string, minLength: 1, maxLength: 512}
    ApprovalIntentEnvelope:
      type: object
      additionalProperties: false
      required: [approval_intent]
      properties:
        approval_intent: {$ref: '#/components/schemas/ApprovalIntent'}
    AuthorityPayload:
      type: object
      minProperties: 1
      maxProperties: 256
      additionalProperties: true
    AuthoritySection:
      type: object
      additionalProperties: false
      required: [schema_version, section, authoritative, available, data, data_digest, fetched_at]
      properties:
        schema_version: {const: agenttrust.authority-view.v1}
        section: {type: string}
        authoritative: {const: true}
        available: {type: boolean}
        data: {type: [object, array, 'null']}
        data_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        safe_error_code: {enum: [AUTHORITATIVE_SOURCE_UNAVAILABLE]}
        fetched_at: {type: string, format: date-time}
    EnterpriseDashboard:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, sections, complete, unavailable_sections, generated_at]
      properties:
        schema_version: {const: agenttrust.enterprise-dashboard.v1}
        tenant_id: {type: string, format: uuid}
        sections: {type: object, additionalProperties: {$ref: '#/components/schemas/AuthoritySection'}}
        complete: {type: boolean}
        unavailable_sections: {type: array, uniqueItems: true, items: {type: string}}
        generated_at: {type: string, format: date-time}
    AguiEvent:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, tenant_id, task_id, sequence, trace_id, kind, safe_payload, occurred_at, backend_signature]
      properties:
        schema_version: {const: agenttrust.a2a-agui.v1}
        event_id: {type: string, minLength: 1, maxLength: 200}
        tenant_id: {type: string, format: uuid}
        task_id: {type: string, minLength: 1, maxLength: 200}
        sequence: {type: integer, minimum: 1}
        trace_id: {type: string, minLength: 1, maxLength: 256}
        kind: {enum: [PLAN_UPDATED, TOOL_REQUESTED, APPROVAL_REQUIRED, APPROVAL_RECORDED, EXECUTION_STATUS, ARTIFACT_AVAILABLE, EVALUATION_UPDATED, INCIDENT]}
        safe_payload: {type: object, maxProperties: 256, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
        backend_signature: {type: string, minLength: 16, maxLength: 4096}
    AguiResumeResponse:
      type: object
      additionalProperties: false
      required: [events, next_resume_token, safe_snapshot_required]
      properties:
        events: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AguiEvent'}}
        next_resume_token: {type: string, maxLength: 2048}
        safe_snapshot_required: {type: boolean}
    AguiSafeSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, task_id, sequence, safe_state, next_resume_token, generated_at, backend_signature]
      properties:
        schema_version: {const: agenttrust.agui-safe-snapshot.v1}
        tenant_id: {type: string, format: uuid}
        task_id: {type: string, minLength: 1, maxLength: 200}
        sequence: {type: integer, minimum: 0}
        safe_state:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
            evidence_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
            occurred_at: {type: string, format: date-time}
        next_resume_token: {type: string, minLength: 1, maxLength: 2048}
        generated_at: {type: string, format: date-time}
        backend_signature: {type: string, minLength: 16, maxLength: 4096}
    AdminAction:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, tenant_id, project_id, operation, resource, requested_by, approval_ids, action_digest, requested_at]
      properties:
        schema_version: {const: agenttrust.enterprise-control.v1}
        action_id: {type: string, minLength: 1}
        tenant_id: {type: string, format: uuid}
        project_id: {type: [string, 'null']}
        operation: {type: string, minLength: 1}
        resource: {type: string, minLength: 1}
        requested_by: {type: string, minLength: 1}
        approval_ids: {type: array, maxItems: 16, uniqueItems: true, items: {type: string}}
        action_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the canonical action binding, excluding this field and including reason plus the governed request payload.
        requested_at: {type: string, format: date-time}
    GovernedAdminIntent:
      type: object
      additionalProperties: false
      required: [intent, reason]
      properties:
        intent: {$ref: '#/components/schemas/AdminAction'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    QuotaSpec:
      type: object
      additionalProperties: false
      required: [maximum_active_tasks, maximum_export_records, maximum_webhooks, maximum_api_requests_per_minute]
      properties:
        maximum_active_tasks: {type: integer, minimum: 1}
        maximum_export_records: {type: integer, minimum: 1}
        maximum_webhooks: {type: integer, minimum: 1}
        maximum_api_requests_per_minute: {type: integer, minimum: 1}
    TenantRequest:
      type: object
      additionalProperties: false
      required: [display_name, owner_subject, data_region, quota]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 200}
        owner_subject: {type: string, minLength: 1, maxLength: 300}
        data_region: {type: string, pattern: '^[A-Z]{2}(-[A-Z0-9]{1,8})?$'}
        quota: {$ref: '#/components/schemas/QuotaSpec'}
    OrganizationRequest:
      type: object
      additionalProperties: false
      required: [organization_id, display_name, sponsor_subject]
      properties:
        organization_id: {type: string, minLength: 1, maxLength: 200}
        display_name: {type: string, minLength: 1, maxLength: 200}
        sponsor_subject: {type: string, minLength: 1, maxLength: 300}
    ProjectRequest:
      type: object
      additionalProperties: false
      required: [project_id, organization_id, owner_subject, environments]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 200}
        organization_id: {type: string, minLength: 1, maxLength: 200}
        owner_subject: {type: string, minLength: 1, maxLength: 300}
        environments: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}
    IntegrationRequest:
      type: object
      additionalProperties: false
      required: [integration_id, kind, endpoint, secret_ref, configuration_digest, active]
      properties:
        integration_id: {type: string, format: uuid}
        kind: {enum: [IAM, NOTIFICATION, TICKETING, SIEM, WEBHOOK]}
        endpoint: {type: string, format: uri, pattern: '^https://'}
        secret_ref: {type: string, minLength: 1, maxLength: 1000}
        configuration_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        active: {type: boolean}
    QuotaConsumeRequest:
      type: object
      additionalProperties: false
      required: [quota_key, window_started_at, amount, limit]
      properties:
        quota_key: {type: string, minLength: 1, maxLength: 100}
        window_started_at: {type: string, format: date-time}
        amount: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1}
    QuotaUsage:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, quota_key, window_started_at, used, limit]
      properties:
        schema_version: {const: agenttrust.quota-usage.v1}
        tenant_id: {type: string, format: uuid}
        quota_key: {type: string}
        window_started_at: {type: string, format: date-time}
        used: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1}
    CostUsageRequest:
      type: object
      additionalProperties: false
      required: [usage_id, project_id, meter, quantity, unit_cost_micros, source_digest, recorded_at]
      properties:
        usage_id: {type: string, format: uuid}
        project_id: {type: string, minLength: 1, maxLength: 200}
        meter: {type: string, minLength: 1, maxLength: 100}
        quantity: {type: integer, minimum: 1}
        unit_cost_micros: {type: integer, minimum: 0}
        source_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        recorded_at: {type: string, format: date-time}
    ApiKeyIssueRequest:
      type: object
      additionalProperties: false
      required: [project_id, scopes, expires_at]
      properties:
        project_id: {type: [string, 'null']}
