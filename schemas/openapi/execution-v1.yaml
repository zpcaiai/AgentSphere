openapi: 3.1.0
info:
  title: AgentTrust Authoritative Execution API
  version: 1.0.0
  description: >-
    Production data-plane API. The data listener requires TLS 1.3, a client certificate
    whose DNS/URI SAN is allowlisted, and a bearer token bound to that SAN and tenant.
servers:
  - url: https://agenttrust-execution
x-agenttrust-outbound-contracts:
  pepPreApproval:
    method: POST
    path: /v1/authorize/pre-approval
    requestSchema: agenttrust.pre-approval-request.v1
    responseSchema: agenttrust.pre-approval-outcome.v1
    description: Determines authoritative dynamic approval requirements before grant consumption.
  pepExecutionAuthorization:
    method: POST
    path: /v1/authorize/execution
    requestSchema: agenttrust.final-authorization-request.v1
    responseSchema: agenttrust.pre-execution-authorization.v1
    fenceHeader: X-AgentTrust-Fence-Digest
    description: Re-evaluates the signed facts only after a durable ledger reservation exists.
  approvalGrantConsumption:
    method: POST
    path: /v1/approvals/grants/consume
    requestSchema: agenttrust.approval-grant-request.v1
    responseSchema: agenttrust.approval-grant-receipt.v1
    idempotencyKey: action_hash
    description: Atomically consumes a signed, action/plan/parameter/policy-bound single-use grant.
  toolExecution:
    method: POST
    path: /v1/tools/execute
    requestSchema: agenttrust.authorized-tool-request.v1
    responseSchema: agenttrust.proxy.v1
    fenceHeader: X-AgentTrust-Fence-Digest
    description: Executes only an exact registry, credential, authorization, fence, and argument binding.
  executionEvidence:
    method: POST
    path: /v1/evidence/executions
    requestSchema: agenttrust.execution-evidence-request.v1
    responseSchema: agenttrust.execution-evidence-receipt.v1
    fenceHeader: X-AgentTrust-Fence-Digest
    description: Persists and signs the exact execution, authorization, request, result, and chain binding.
paths:
  /v1/executions/execute:
    post:
      operationId: executeAuthoritativeAction
      description: >-
        Materializes Canonical Action IR, performs PEP pre-approval, consumes any required
        authoritative grant, then performs signed pre-execution authorization before ledger-fenced
        execution. Approval-required actions must bind their immutable plan through the
        x-plan-hash Canonical Action extension.
      security: [{mtls: [], bearer: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {$ref: '#/components/schemas/IdempotencyKey'}
          description: Must exactly equal request.idempotency_key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionRequest'}
      responses:
        '200':
          description: Durable ledger outcome; process status remains distinct from task status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionOutcome'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
        '502': {$ref: '#/components/responses/Failure'}
        '503': {$ref: '#/components/responses/Failure'}
  /ready:
    get:
      operationId: executionReadiness
      description: >-
        On the TLS data listener, mTLS and a bound bearer token are required. The separate
        plaintext management listener exposes only this path and must be network-policy restricted.
      responses:
        '200':
          description: Database materialization, registry, approval, ledger, PEP, tool-proxy, and evidence are ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ready'}
        '503':
          description: At least one authoritative dependency is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotReady'}
components:
  securitySchemes:
    mtls: {type: mutualTLS}
    bearer: {type: http, scheme: bearer}
  responses:
    Failure:
      description: Fail-closed execution error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Uuid:
      type: string
      format: uuid
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
    ActionMaterializationRef:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, action_id, payload_hash, store, uri]
      properties:
        schema_version: {const: agenttrust.action-materialization-ref.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        action_id: {$ref: '#/components/schemas/Uuid'}
        payload_hash: {$ref: '#/components/schemas/Digest'}
        store: {const: ORCHESTRATOR_INGRESS_POSTGRESQL}
        uri:
          type: string
          minLength: 80
          maxLength: 256
          pattern: '^orchestrator-ingress://[0-9a-f-]{36}/[0-9a-f-]{36}$'
    ExecutionRequest:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, task_id, action_id, ingress_digest, idempotency_key, action_materialization]
      properties:
        schema_version: {const: agenttrust.execution-request.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        action_id: {$ref: '#/components/schemas/Uuid'}
        ingress_digest: {$ref: '#/components/schemas/Digest'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        action_materialization: {$ref: '#/components/schemas/ActionMaterializationRef'}
    ExecutionOutcome:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, task_id, action_id, ingress_digest, idempotency_key, ledger_execution_id, fence_digest, status, outcome_digest, evidence_refs, action_materialization]
      properties:
        schema_version: {const: agenttrust.execution-outcome.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        action_id: {$ref: '#/components/schemas/Uuid'}
        ingress_digest: {$ref: '#/components/schemas/Digest'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        ledger_execution_id: {$ref: '#/components/schemas/Uuid'}
        fence_digest: {$ref: '#/components/schemas/Digest'}
        status:
          enum: [PREPARED, RUNNING, SUCCEEDED, FAILED, TIMED_OUT, CANCELLED, KILLED, COMPENSATING, COMPENSATED, COMPENSATION_FAILED, UNKNOWN]
        outcome_digest: {$ref: '#/components/schemas/Digest'}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 1024
          items: {type: string, minLength: 1, maxLength: 2048}
        action_materialization: {$ref: '#/components/schemas/ActionMaterializationRef'}
    CanonicalAction:
      $ref: ../json/action.schema.json
    ToolRef:
      type: object
      additionalProperties: false
      required: [tool_id, tool_version]
      properties:
        tool_id: {type: string, minLength: 1, maxLength: 256}
        tool_version: {type: string, minLength: 1, maxLength: 256}
    ResolvedToolSnapshot:
      $ref: ./registry-v1.yaml#/components/schemas/ResolvedToolSnapshot
    PolicyInput:
      type: object
      additionalProperties: false
      required: [subject, intent, tool, arguments, resource, environment, current_state_version, execution_plan_hash, data_classification, trajectory_risk, registry_snapshot_hash, runtime]
      properties:
        subject: {type: object}
        intent: {type: object}
        tool: {type: object}
        arguments: {type: object}
        resource: {type: object}
        environment: {type: object}
        current_state_version: {type: [string, 'null'], minLength: 1, maxLength: 256}
        execution_plan_hash:
          anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]
        data_classification: {enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED, REGULATED]}
        trajectory_risk: {type: object}
        registry_snapshot_hash: {$ref: '#/components/schemas/Digest'}
        runtime: {type: object}
    PolicyDecision:
      type: object
      additionalProperties: false
      required: [schema_version, decision_id, decision, reason_codes, policy_version, policy_bundle_hash, input_hash, evaluated_at, expires_at, obligations, risk_summary]
      properties:
        schema_version: {const: agenttrust.policy.v1}
        decision_id: {type: string, minLength: 1, maxLength: 256}
        decision: {enum: [ALLOW, DENY, REQUIRE_APPROVAL, PAUSE, KILL]}
        reason_codes: {type: array, maxItems: 128, items: {type: string, maxLength: 256}}
        policy_version: {type: string, minLength: 1, maxLength: 256}
        policy_bundle_hash: {$ref: '#/components/schemas/Digest'}
        input_hash: {$ref: '#/components/schemas/Digest'}
        evaluated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        obligations: {type: array, maxItems: 128, items: {type: object}}
        risk_summary: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    AuthoritativeFactRef:
      type: object
      additionalProperties: false
      required: [kind, status, uri, digest, version, observed_at, valid_until]
      properties:
        kind: {enum: [IDENTITY, RESOURCE_STATE, BUDGET, TRAJECTORY_RISK, REGISTRY, ENVIRONMENT]}
        status: {enum: [VERIFIED, UNKNOWN, STALE, ERROR]}
        uri: {type: string, minLength: 1, maxLength: 2048}
        digest: {$ref: '#/components/schemas/Digest'}
        version: {type: string, minLength: 1, maxLength: 256}
        observed_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
    AuthoritativeFactSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, action_hash, identity_subject, identity_uses_dev_verifier, identity_revocation_epoch, resource_state_version, resource_state_fresh, budget_remaining_microunits, trajectory_risk_version, accumulated_resources, anomaly_score_millionths, fact_refs, captured_at, expires_at, snapshot_digest]
      properties:
        schema_version: {const: agenttrust.authoritative-fact-snapshot.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        identity_subject: {type: [string, 'null'], minLength: 1, maxLength: 512}
        identity_uses_dev_verifier: {type: [boolean, 'null']}
        identity_revocation_epoch: {type: [integer, 'null'], minimum: 0}
        resource_state_version: {type: [string, 'null'], minLength: 1, maxLength: 256}
        resource_state_fresh: {type: [boolean, 'null']}
        budget_remaining_microunits: {type: [integer, 'null'], minimum: 0}
        trajectory_risk_version: {type: [string, 'null'], minLength: 1, maxLength: 256}
        accumulated_resources: {type: [array, 'null'], maxItems: 4096, items: {type: string, maxLength: 2048}}
        anomaly_score_millionths: {type: [integer, 'null'], minimum: 0, maximum: 1000000}
        fact_refs: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {$ref: '#/components/schemas/AuthoritativeFactRef'}}
        captured_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        snapshot_digest: {$ref: '#/components/schemas/Digest'}
    SignedPreApprovalOutcome:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, task_id, step_id, action_hash, tool_id, tool_version, tool_snapshot_hash, stage, idempotency_key, request_digest, fact_snapshot, fact_snapshot_digest, execution_plan_digest, approval_required, decision, issued_at, expires_at, issuer, key_id, key_usage, signature]
      properties:
        schema_version: {const: agenttrust.pre-approval-outcome.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        step_id: {$ref: '#/components/schemas/Uuid'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        tool_id: {type: string, minLength: 1, maxLength: 256}
        tool_version: {type: string, minLength: 1, maxLength: 256}
        tool_snapshot_hash: {$ref: '#/components/schemas/Digest'}
        stage: {const: PRE_APPROVAL}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        request_digest: {$ref: '#/components/schemas/Digest'}
        fact_snapshot: {$ref: '#/components/schemas/AuthoritativeFactSnapshot'}
        fact_snapshot_digest: {$ref: '#/components/schemas/Digest'}
        execution_plan_digest: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        approval_required: {type: boolean}
        decision: {$ref: '#/components/schemas/PolicyDecision'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        issuer: {type: string, minLength: 1, maxLength: 256}
        key_id: {type: string, minLength: 1, maxLength: 256}
        key_usage: {const: PEP_PRE_APPROVAL}
        signature: {type: string, minLength: 1, maxLength: 256}
    PreApprovalRequest:
      type: object
      additionalProperties: false
      required: [schema_version, action, action_hash, tool, idempotency_key, requested_at]
      properties:
        schema_version: {const: agenttrust.pre-approval-request.v1}
        action: {$ref: '#/components/schemas/CanonicalAction'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        tool: {$ref: '#/components/schemas/ResolvedToolSnapshot'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        requested_at: {type: string, format: date-time}
    PreApprovalEnvelope:
      type: object
      additionalProperties: false
      required: [schema_version, signed_outcome, compensation_plan]
      properties:
        schema_version: {const: agenttrust.pre-approval-envelope.v1}
        signed_outcome: {$ref: '#/components/schemas/SignedPreApprovalOutcome'}
        compensation_plan: {type: [object, 'null']}
    MinimalApprovalGrant:
      type: object
      additionalProperties: false
      required: [schema_version, approval_id, task_id, step_id, action_hash, resource_version, policy_version, approver_subject, approver_roles, expires_at, single_use]
      properties:
        schema_version: {type: string, minLength: 1}
        approval_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        step_id: {$ref: '#/components/schemas/Uuid'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        resource_version: {type: string, minLength: 1, maxLength: 256}
        policy_version: {type: string, minLength: 1, maxLength: 256}
        approver_subject: {type: string, minLength: 1, maxLength: 512}
        approver_roles: {type: array, minItems: 1, maxItems: 64, items: {type: string, maxLength: 256}}
        expires_at: {type: string, format: date-time}
        single_use: {const: true}
    ApprovalGrantRequest:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, task_id, step_id, action_hash, plan_hash, parameter_hash, resource, resource_version, policy_version, environment, maximum_risk]
      properties:
        schema_version: {const: agenttrust.approval-grant-request.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        step_id: {$ref: '#/components/schemas/Uuid'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        plan_hash: {$ref: '#/components/schemas/Digest'}
        parameter_hash: {$ref: '#/components/schemas/Digest'}
        resource: {type: string, minLength: 1, maxLength: 2048}
        resource_version: {type: string, minLength: 1, maxLength: 256}
        policy_version: {type: string, minLength: 1, maxLength: 256}
        environment: {type: string, minLength: 1, maxLength: 128}
        maximum_risk: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    EnterpriseApprovalGrant:
      type: object
      additionalProperties: false
      required: [schema_version, grant_id, case_id, tenant_id, task_id, step_id, action_hash, plan_hash, parameter_hash, resource, resource_version, policy_version, environment, maximum_risk, approver_subjects, issued_at, expires_at, maximum_uses, break_glass, issuer, key_id, signature]
      properties:
        schema_version: {const: agenttrust.enterprise-approval.v1}
        grant_id: {$ref: '#/components/schemas/Uuid'}
        case_id: {$ref: '#/components/schemas/Uuid'}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        step_id: {$ref: '#/components/schemas/Uuid'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        plan_hash: {$ref: '#/components/schemas/Digest'}
        parameter_hash: {$ref: '#/components/schemas/Digest'}
        resource: {type: string, minLength: 1, maxLength: 2048}
        resource_version: {type: string, minLength: 1, maxLength: 256}
        policy_version: {type: string, minLength: 1, maxLength: 256}
        environment: {type: string, minLength: 1, maxLength: 128}
        maximum_risk: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        approver_subjects: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, maxLength: 512}}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        maximum_uses: {const: 1}
        break_glass: {type: boolean}
        issuer: {type: string, minLength: 1, maxLength: 256}
        key_id: {type: string, minLength: 1, maxLength: 256}
        signature: {type: string, minLength: 1, maxLength: 256}
    ApprovalGrantReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, grant, consumed_at, remaining_uses, consumption_ref]
      properties:
        schema_version: {const: agenttrust.approval-grant-receipt.v1}
        grant: {$ref: '#/components/schemas/EnterpriseApprovalGrant'}
        consumed_at: {type: string, format: date-time}
        remaining_uses: {const: 0}
        consumption_ref: {type: string, minLength: 1, maxLength: 2048}
    FinalAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, stage, action, action_hash, tool, policy_input, preapproval, approval, approval_consumption_ref, approval_receipt_digest, ledger_execution_id, ledger_event_id, ledger_event_digest, fence_digest, idempotency_key, requested_at]
      properties:
        schema_version: {const: agenttrust.final-authorization-request.v1}
        stage: {const: PRE_EXECUTION}
        action: {$ref: '#/components/schemas/CanonicalAction'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        tool: {$ref: '#/components/schemas/ResolvedToolSnapshot'}
        policy_input: {$ref: '#/components/schemas/PolicyInput'}
        preapproval: {$ref: '#/components/schemas/SignedPreApprovalOutcome'}
        approval: {anyOf: [{$ref: '#/components/schemas/MinimalApprovalGrant'}, {type: 'null'}]}
        approval_consumption_ref: {type: [string, 'null'], maxLength: 2048}
        approval_receipt_digest: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        ledger_execution_id: {$ref: '#/components/schemas/Uuid'}
        ledger_event_id: {$ref: '#/components/schemas/Uuid'}
        ledger_event_digest: {$ref: '#/components/schemas/Digest'}
        fence_digest: {$ref: '#/components/schemas/Digest'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        requested_at: {type: string, format: date-time}
    ExecutionAuthorization:
      type: object
      additionalProperties: false
      required: [schema_version, authorization_id, tenant_id, task_id, step_id, agent_instance_id, action_hash, tool_id, tool_version, tool_snapshot_hash, implementation_digest, executor_profile, operation, resource, canonical_arguments_hash, target_profile, environment, idempotency_key, ledger_execution_id, ledger_event_id, ledger_event_digest, fence_digest, policy_decision_id, policy_decision_digest, policy_version, policy_bundle_hash, policy_input_hash, authorization_evidence_ref, authorization_evidence_digest, preapproval_digest, approval_ids, approval_consumption_ref, approval_receipt_digest, resource_version, sandbox_profile, network_profile, credential_profile, workload_credential_id, workload_credential_claims_digest, workload_credential_audience, workload_credential_revocation_epoch, max_execution_ms, max_result_bytes, issued_at, expires_at, single_use, issuer, key_id, key_usage, signature]
      properties:
        schema_version: {const: agenttrust.execution-authorization.v2}
        authorization_id: {$ref: '#/components/schemas/Uuid'}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        step_id: {$ref: '#/components/schemas/Uuid'}
        agent_instance_id: {$ref: '#/components/schemas/Uuid'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        tool_id: {type: string, minLength: 1, maxLength: 256}
        tool_version: {type: string, minLength: 1, maxLength: 256}
        tool_snapshot_hash: {$ref: '#/components/schemas/Digest'}
        implementation_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        executor_profile: {type: string, minLength: 1, maxLength: 256}
        operation: {type: string, minLength: 1, maxLength: 256}
        resource: {type: string, minLength: 1, maxLength: 2048}
        canonical_arguments_hash: {$ref: '#/components/schemas/Digest'}
        target_profile: {type: string, minLength: 1, maxLength: 256}
        environment: {type: string, minLength: 1, maxLength: 128}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        ledger_execution_id: {$ref: '#/components/schemas/Uuid'}
        ledger_event_id: {$ref: '#/components/schemas/Uuid'}
        ledger_event_digest: {$ref: '#/components/schemas/Digest'}
        fence_digest: {$ref: '#/components/schemas/Digest'}
        policy_decision_id: {type: string, minLength: 1, maxLength: 256}
        policy_decision_digest: {$ref: '#/components/schemas/Digest'}
        policy_version: {type: string, minLength: 1, maxLength: 256}
        policy_bundle_hash: {$ref: '#/components/schemas/Digest'}
        policy_input_hash: {$ref: '#/components/schemas/Digest'}
        authorization_evidence_ref: {type: string, pattern: '^urn:agenttrust:pep-authorization:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:sha256:[0-9a-f]{64}$', maxLength: 256}
        authorization_evidence_digest: {$ref: '#/components/schemas/Digest'}
        preapproval_digest: {$ref: '#/components/schemas/Digest'}
        approval_ids: {type: array, maxItems: 64, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        approval_consumption_ref: {type: [string, 'null'], maxLength: 2048}
        approval_receipt_digest: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        resource_version: {type: string, minLength: 1, maxLength: 256}
        sandbox_profile: {type: string, minLength: 1, maxLength: 256}
        network_profile: {type: string, minLength: 1, maxLength: 256}
        credential_profile: {type: string, minLength: 1, maxLength: 256}
        workload_credential_id: {$ref: '#/components/schemas/Uuid'}
        workload_credential_claims_digest: {$ref: '#/components/schemas/Digest'}
        workload_credential_audience: {const: tool-proxy}
        workload_credential_revocation_epoch: {type: integer, minimum: 0}
        max_execution_ms: {type: integer, minimum: 1}
        max_result_bytes: {type: integer, minimum: 1}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        single_use: {const: true}
        issuer: {type: string, minLength: 1, maxLength: 256}
        key_id: {type: string, minLength: 1, maxLength: 256}
        key_usage: {const: PEP_EXECUTION_AUTHORIZATION}
        signature: {type: string, minLength: 1, maxLength: 256}
    WorkloadCredentialClaims:
      type: object
      additionalProperties: false
      required: [schema_version, idempotency_key, credential_id, tenant_id, agent_instance_id, task_id, step_id, action_hash, policy_decision_id, tool_id, credential_profile, operation, resource, target_profile, audience, revocation_epoch, issued_at, expires_at, max_uses]
      properties:
        schema_version: {const: agenttrust.workload-credential-claims.v1}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        credential_id: {$ref: '#/components/schemas/Uuid'}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        agent_instance_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        step_id: {$ref: '#/components/schemas/Uuid'}
        action_hash: {$ref: '#/components/schemas/Digest'}
        policy_decision_id: {type: string, minLength: 1, maxLength: 256}
        tool_id: {type: string, minLength: 1, maxLength: 256}
        credential_profile: {type: string, minLength: 1, maxLength: 256}
