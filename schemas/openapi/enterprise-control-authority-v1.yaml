openapi: 3.1.0
info:
  title: AgentTrust Enterprise Control Authority
  version: 1.0.0
  description: >-
    Trusted BFF ingress and fenced Tool Proxy executor. Action acceptance is distinct from
    execution success and task completion; final completion requires signed Evidence authority
    evidence through the durable orchestrator.
servers:
  - url: https://enterprise-control-authority.agenttrust.svc.cluster.local:8449
x-agenttrust-management-server:
  url: http://0.0.0.0:9100
  paths: [/ready]
  schema: agenttrust.enterprise-authority-readiness.v1
security:
  - scopedBearer: []
paths:
  /ready:
    get:
      operationId: enterpriseAuthorityReady
      responses:
        '200':
          description: Dependencies ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
  /v1/enterprise/actions:
    post:
      operationId: submitEnterpriseAction
      description: >-
        Requires TLS 1.3 mTLS with one exact BFF SAN, an enterprise:mutate token and a
        request-bound signed human principal assertion. Returns durable acceptance only.
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {$ref: '#/components/parameters/Idempotency'}
        - {$ref: '#/components/parameters/HumanAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnterpriseMutationRequest'}
      responses:
        '202':
          description: Canonical action durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnterpriseActionReceipt'}
        '400': {$ref: '#/components/responses/Rejected'}
        '401': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/enterprise/mutations:
    post:
      operationId: executeEnterpriseMutation
      description: >-
        Tool Proxy only. Immutable headers are derived from verified PEP authorization and the
        ledger fence; caller arguments cannot override them. Raw API key material never appears
        in the response.
      parameters:
        - {$ref: '#/components/parameters/Tenant'}
        - {$ref: '#/components/parameters/Idempotency'}
        - {$ref: '#/components/parameters/ActionHash'}
        - {$ref: '#/components/parameters/LedgerExecution'}
        - {$ref: '#/components/parameters/Fence'}
        - {$ref: '#/components/parameters/ResourceVersion'}
        - {$ref: '#/components/parameters/Trace'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnterpriseExecutorRequest'}
      responses:
        '200':
          description: Safe executor result; Evidence authority validation is still pending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnterpriseMutationResult'}
        '400': {$ref: '#/components/responses/Rejected'}
        '401': {$ref: '#/components/responses/Rejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    scopedBearer: {type: http, scheme: bearer}
  parameters:
    Tenant:
      name: X-AgentTrust-Tenant-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:/-]+$'}
    HumanAssertion:
      name: X-AgentTrust-Human-Assertion
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 87384}
    ActionHash:
      name: X-AgentTrust-Action-Hash
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    LedgerExecution:
      name: X-AgentTrust-Ledger-Execution-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    Fence:
      name: X-AgentTrust-Fence-Digest
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    ResourceVersion:
      name: X-AgentTrust-Resource-Version
      in: header
      required: true
      schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
    Trace:
      name: X-AgentTrust-Trace-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
  responses:
    Rejected:
      description: Invalid or denied request
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Idempotency, fence, or state-version conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Dependency unavailable or outcome is UNKNOWN and cannot be replayed
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    Readiness:
      type: object
      additionalProperties: false
      required: [schema_version, ready]
      properties:
        schema_version: {const: agenttrust.enterprise-authority-readiness.v1}
        ready: {const: true}
    EnterpriseAdminIntent:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, tenant_id, operation, resource, requested_by, approval_ids, action_digest, requested_at]
      properties:
        schema_version: {const: agenttrust.enterprise-control.v1}
        action_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        project_id: {type: [string, 'null'], maxLength: 200}
        operation: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,99}$'}
        resource: {type: string, minLength: 1, maxLength: 1000}
        requested_by: {type: string, minLength: 1, maxLength: 256}
        approval_ids: {type: array, maxItems: 1024, uniqueItems: true, items: {type: string, maxLength: 256}}
        action_digest: {$ref: '#/components/schemas/Digest'}
        requested_at: {type: string, format: date-time}
    EnterpriseMutationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, admin_intent, reason_digest, mutation]
      properties:
        schema_version: {const: agenttrust.enterprise-mutation-request.v1}
        tenant_id: {type: string, format: uuid}
        admin_intent: {$ref: '#/components/schemas/EnterpriseAdminIntent'}
        reason_digest: {$ref: '#/components/schemas/Digest'}
        mutation: {type: object, maxProperties: 64}
    EnterpriseExecutorRequest:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, operation, resource, admin_action_digest, reason_digest, requester_subject, approval_ids, mutation]
      properties:
        schema_version: {const: agenttrust.enterprise-executor-request.v1}
        action_id: {type: string, format: uuid}
        operation:
          enum: [CREATE_TENANT, CREATE_ORGANIZATION, CREATE_PROJECT, CREATE_INTEGRATION, CONSUME_QUOTA, RECORD_COST, ISSUE_API_KEY, REVOKE_API_KEY, SUBMIT_ADMIN_ACTION]
        resource: {type: string, minLength: 1, maxLength: 1000}
        admin_action_digest: {$ref: '#/components/schemas/Digest'}
        reason_digest: {$ref: '#/components/schemas/Digest'}
        requester_subject: {type: string, minLength: 1, maxLength: 256}
        approval_ids: {type: array, maxItems: 1024, uniqueItems: true, items: {type: string}}
        mutation: {type: object, maxProperties: 64}
    EnterpriseActionReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, task_id, accepted, start_requested, execution_pending, ingress_digest, evidence_ref, evidence_digest]
      properties:
        schema_version: {const: agenttrust.enterprise-action-receipt.v1}
        action_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        accepted: {const: true}
        start_requested: {const: true}
        execution_pending: {const: true}
        ingress_digest: {$ref: '#/components/schemas/Digest'}
        evidence_ref: {type: string, pattern: '^orchestrator-event://[0-9a-f-]{36}/[0-9a-f-]{36}/[1-9][0-9]*$'}
        evidence_digest: {$ref: '#/components/schemas/Digest'}
    EnterpriseMutationResult:
      type: object
      additionalProperties: false
      required: [schema_version, action_id, state, resource, previous_resource_version, resource_version, credential_ref, safe_result]
      properties:
        schema_version: {const: agenttrust.enterprise-mutation-result.v1}
        action_id: {type: string, format: uuid}
        state: {const: SUCCEEDED}
        resource: {type: string}
        previous_resource_version: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        resource_version: {type: string, pattern: '^[1-9][0-9]*$'}
        credential_ref: {type: [string, 'null'], pattern: '^vault-kv://.+#v[1-9][0-9]*$'}
        safe_result:
          type: object
          not: {required: [one_time_secret]}
    Error:
      type: object
      additionalProperties: false
      required: [schema_version, error]
      properties:
        schema_version: {const: agenttrust.enterprise-authority-error.v1}
        error: {type: string}
