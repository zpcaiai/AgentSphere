openapi: 3.1.0
info:
  title: AgentTrust Pack Supply Chain Production Authority
  version: 1.0.0
servers:
  - url: https://pack-supply-chain.internal:8093
security:
  - mutualTLS: []
    bearerAuth: []
paths:
  /ready:
    get:
      operationId: supplyChainReady
      security:
        - mutualTLS: []
      responses:
        "200":
          description: All required production dependencies are ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, ready, database_ready, repository_ready, signer_ready, scanner_ready, sandbox_ready, revocation_ready, evidence_ready]
                properties:
                  schema_version: {const: agenttrust.supply-chain-readiness.v1}
                  ready: {const: true}
                  database_ready: {const: true}
                  repository_ready: {const: true}
                  signer_ready: {const: true}
                  scanner_ready: {const: true}
                  sandbox_ready: {const: true}
                  revocation_ready: {const: true}
                  evidence_ready: {const: true}
  /v1/supply-chain/executions:
    post:
      operationId: executeSupplyChainMutation
      parameters:
        - {$ref: "#/components/parameters/Tenant"}
        - {$ref: "#/components/parameters/Idempotency"}
        - {$ref: "#/components/parameters/ActionId"}
        - {$ref: "#/components/parameters/AuthorizationId"}
        - {$ref: "#/components/parameters/AuthorizationDigest"}
        - {$ref: "#/components/parameters/PolicyDecisionId"}
        - {$ref: "#/components/parameters/PolicyDecisionDigest"}
        - {$ref: "#/components/parameters/AuthorizationEvidenceRef"}
        - {$ref: "#/components/parameters/AuthorizationEvidenceDigest"}
        - {$ref: "#/components/parameters/LedgerExecutionId"}
        - {$ref: "#/components/parameters/LedgerEntryId"}
        - {$ref: "#/components/parameters/LedgerEntryDigest"}
        - {$ref: "#/components/parameters/FenceDigest"}
        - {$ref: "#/components/parameters/ResourceVersion"}
        - {$ref: "#/components/parameters/TraceId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../domain-pack/supply-chain-execution.schema.json
      responses:
        "200":
          description: Durable terminal or existing idempotent result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MutationResult"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/supply-chain/recoveries/{tenant_id}:
    post:
      operationId: markExpiredSupplyChainExecutionsUnknown
      description: Safety reconciliation only; it cannot replay an external effect.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/Tenant"}
      responses:
        "200":
          description: Expired EXECUTING rows atomically marked UNKNOWN
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, marked_unknown]
                properties:
                  schema_version: {const: agenttrust.supply-chain-recovery.v1}
                  marked_unknown: {type: integer, minimum: 0, maximum: 100}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/authoritative/supply-chain/releases:
    get:
      operationId: listAuthoritativeSupplyChainReleases
      description: Tenant-isolated authoritative state; data_digest is the JCS SHA-256 of the final response after removing only data_digest.
      parameters:
        - {$ref: "#/components/parameters/Tenant"}
        - name: tenant_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 2048}
      responses:
        "200":
          description: Authoritative release page with independently verifiable canonical digest and receipt references
          content:
            application/json:
              schema: {$ref: ../domain-pack/authoritative-releases.schema.json}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    mutualTLS: {type: mutualTLS}
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    Tenant: {name: X-AgentTrust-Tenant-Id, in: header, required: true, schema: {type: string, format: uuid}}
    Idempotency: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{15,255}$"}}
    ActionId: {name: X-AgentTrust-Action-Id, in: header, required: true, schema: {type: string, format: uuid}}
    AuthorizationId: {name: X-AgentTrust-Authorization-Id, in: header, required: true, schema: {type: string, format: uuid}}
    AuthorizationDigest: {name: X-AgentTrust-Authorization-Digest, in: header, required: true, schema: {$ref: "#/components/schemas/Digest"}}
    PolicyDecisionId: {name: X-AgentTrust-Policy-Decision-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    PolicyDecisionDigest: {name: X-AgentTrust-Policy-Decision-Digest, in: header, required: true, schema: {$ref: "#/components/schemas/Digest"}}
    AuthorizationEvidenceRef: {name: X-AgentTrust-Authorization-Evidence-Ref, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 1024}}
    AuthorizationEvidenceDigest: {name: X-AgentTrust-Authorization-Evidence-Digest, in: header, required: true, schema: {$ref: "#/components/schemas/Digest"}}
    LedgerExecutionId: {name: X-AgentTrust-Ledger-Execution-Id, in: header, required: true, schema: {type: string, format: uuid}}
    LedgerEntryId: {name: X-AgentTrust-Ledger-Entry-Id, in: header, required: true, schema: {type: string, format: uuid}}
    LedgerEntryDigest: {name: X-AgentTrust-Ledger-Entry-Digest, in: header, required: true, schema: {$ref: "#/components/schemas/Digest"}}
    FenceDigest: {name: X-AgentTrust-Fence-Digest, in: header, required: true, schema: {$ref: "#/components/schemas/Digest"}}
    ResourceVersion: {name: X-AgentTrust-Resource-Version, in: header, required: true, schema: {type: integer, minimum: 1}}
    TraceId: {name: X-AgentTrust-Trace-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
  schemas:
    Digest: {type: string, pattern: "^[a-f0-9]{64}$"}
    MutationResult:
      type: object
      additionalProperties: false
      required: [schema_version, command_id, state, resource_key, resource_version, result_digest, evidence_ref, evidence_digest, stable_error, effect_receipt]
      properties:
        schema_version: {const: agenttrust.supply-chain-result.v1}
        command_id: {type: string, format: uuid}
        state: {enum: [PREPARED, EXECUTING, SUCCEEDED, FAILED, UNKNOWN]}
        resource_key: {type: string, minLength: 1, maxLength: 768}
        resource_version: {type: integer, minimum: 1}
        result_digest: {oneOf: [{$ref: "#/components/schemas/Digest"}, {type: "null"}]}
        evidence_ref: {type: [string, "null"], maxLength: 1024}
        evidence_digest: {oneOf: [{$ref: "#/components/schemas/Digest"}, {type: "null"}]}
        stable_error: {type: [string, "null"], maxLength: 128}
        effect_receipt: {oneOf: [{$ref: ../domain-pack/runtime-receipt.schema.json}, {type: "null"}]}
  responses:
    Error:
      description: Stable fail-closed error
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [schema_version, error]
            properties:
              schema_version: {const: agenttrust.supply-chain-error.v1}
              error: {type: string, pattern: "^SUPPLY_CHAIN_[A-Z0-9_]+$"}
