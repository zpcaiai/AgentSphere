openapi: 3.1.0
info:
  title: Agent Trust Enterprise Approval API
  version: 1.0.0
  description: >-
    Tenant-isolated approval case lifecycle and atomic, single-use production
    grant consumption. The data plane requires native TLS 1.3 mutual TLS,
    an exact allow-listed DNS or URI SAN, and a tenant/scope/opaque-service-token
    binding. Human mutations additionally require a short-lived Ed25519
    principal assertion bound to the authenticated service and exact request.
servers:
  - url: https://approval.agenttrust.invalid
security:
  - mutualTLS: []
    bearerAuth: []
paths:
  /ready:
    get:
      operationId: getApprovalReadiness
      security:
        - mutualTLS: []
      responses:
        '200':
          description: Approval datastore and required schema are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Approval datastore or required schema is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /v1/authoritative/approvals:
    get:
      operationId: listAuthoritativeApprovalCases
      x-required-service-scope: approvals:read
      description: >-
        Returns a tenant-scoped, bounded approval inbox page. The resource
        parameter is a dashboard view selector and is bound into the signed
        cursor; it is not interpreted as an approval resource authorization
        filter. Cursor signatures prevent cross-tenant, cross-view, or ordering
        substitution. Raw justification and human identity assertion material
        are never returned by this safe view.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: resource
          in: query
          required: false
          schema:
            type: string
            default: summary
            minLength: 1
            maxLength: 100
            pattern: '^[a-z][a-z0-9_-]{0,99}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 5462
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Authoritative approval inbox page and canonical data digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoritativeApprovalPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/cases:
    post:
      operationId: createApprovalCase
      x-required-service-scope: approvals:request
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PrincipalAssertion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCaseCreateEnvelope'
      responses:
        '201':
          description: Durable approval case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCase'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/cases/{case_id}:
    get:
      operationId: getApprovalCase
      x-required-service-scope: approvals:read
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Tenant-scoped approval case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCase'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/cases/{case_id}/decisions:
    post:
      operationId: decideApprovalCase
      x-required-service-scope: approvals:decide
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PrincipalAssertion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionEnvelope'
      responses:
        '200':
          description: Case with the durable decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCase'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/cases/{case_id}/grants:
    post:
      operationId: issueApprovalGrant
      x-required-service-scope: approvals:issue
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PrincipalAssertion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalGrantIssueRequest'
      responses:
        '200':
          description: Ed25519-signed, action-bound, single-use grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseApprovalGrant'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/grants/{grant_id}/revoke:
    post:
      operationId: revokeApprovalGrant
      x-required-service-scope: approvals:revoke
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/GrantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PrincipalAssertion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalGrantRevocationRequest'
      responses:
        '200':
          description: Signed revocation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalGrantRevocationReceipt'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/grants/consume:
    post:
      operationId: consumeApprovalGrant
      x-required-service-scope: approvals:consume
      description: >-
        Atomically selects the uniquely action-bound grant, verifies its
        signature and lifecycle, decrements remaining uses from one to zero,
        and persists the signed receipt and replay response in one transaction.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalGrantRequest'
      responses:
        '200':
          description: Execution-client-compatible atomic consumption receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalGrantReceipt'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/consumptions/{consumption_ref}:
    get:
      operationId: getSignedApprovalConsumption
      x-required-service-scope: approvals:verify
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ConsumptionRef'
      responses:
        '200':
          description: Full Ed25519-signed consumption payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedApprovalConsumptionReceipt'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    TenantId:
      name: x-agenttrust-tenant-id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9_.:/-]+$'
    PrincipalAssertion:
      name: x-agenttrust-principal-assertion
      in: header
      required: true
      description: >-
        Base64url-no-pad encoding of SignedApprovalPrincipalAssertion. Its
        request_digest is lowercase SHA-256 of RFC 8785 JCS over
        {schema_version: agenttrust.approval-principal-request-binding.v1,
        method, path, tenant_id, client_identity, service_subject, scope,
        idempotency_key, body}. `body` is the strict typed DTO reserialization;
        set-valued arrays such as roles, owned_resources, and required_roles are
        lexicographically sorted before JCS. The assertion is verified independently from
        the opaque BFF service token and has a maximum lifetime of 300 seconds.
      schema:
        type: string
        minLength: 1
        maxLength: 43691
        pattern: '^[A-Za-z0-9_-]+$'
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GrantId:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConsumptionRef:
      name: consumption_ref
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: '^urn:agenttrust:approval-consumption:[0-9a-f-]{36}:sha256:[0-9a-f]{64}:kid:[A-Za-z0-9_.-]{1,128}:sig:[A-Za-z0-9_-]{86}$'
  responses:
    Error:
      description: Stable fail-closed error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    DateTime:
      type: string
      format: date-time
    Readiness:
      type: object
      additionalProperties: false
      required: [schema_version, ready]
      properties:
        schema_version: { type: string, const: agenttrust.approval-readiness.v1 }
        ready: { type: boolean }
    CodingApprovalReviewDetails:
      type: object
      additionalProperties: false
      required: [diff_artifact_ref, command_summary, network_scope, rollback_summary]
      properties:
        diff_artifact_ref: {type: string, pattern: '^artifact://sha256/[a-f0-9]{64}$'}
        command_summary: {type: string, minLength: 1, maxLength: 2048}
        network_scope: {type: string, minLength: 1, maxLength: 1024}
        rollback_summary: {type: string, minLength: 1, maxLength: 2048}
    IndustrialApprovalReviewDetails:
      type: object
      additionalProperties: false
      required: [current_value, target_value, allowed_range, interlock_summary, physical_impact]
      properties:
        current_value: {type: string, minLength: 1, maxLength: 512}
        target_value: {type: string, minLength: 1, maxLength: 512}
        allowed_range: {type: string, minLength: 1, maxLength: 512}
        interlock_summary: {type: string, minLength: 1, maxLength: 2048}
        physical_impact: {type: string, minLength: 1, maxLength: 2048}
    ApprovalReviewContext:
      description: >-
        Domain-discriminated safe review material. Raw commands, device frames, credentials,
        secrets and bearer values are rejected by the authority before persistence.
      oneOf:
        - type: object
          additionalProperties: false
          required: [domain, details]
          properties:
            domain: {const: CODING}
            details: {$ref: '#/components/schemas/CodingApprovalReviewDetails'}
        - type: object
          additionalProperties: false
          required: [domain, details]
          properties:
            domain: {const: INDUSTRIAL}
            details: {$ref: '#/components/schemas/IndustrialApprovalReviewDetails'}
    ApprovalReviewMaterial:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - tenant_id
        - task_id
        - canonical_action_hash
        - resource
        - resource_version
        - policy_version
        - environment
        - risk
        - review_context
        - risk_package_ref
        - risk_package_digest
        - state_snapshot_ref
        - state_snapshot_digest
      properties:
        schema_version: {type: string, const: agenttrust.approval-review-material.v1}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        canonical_action_hash: {$ref: '#/components/schemas/Digest'}
        resource: {type: string, minLength: 1, maxLength: 2048}
        resource_version: {type: string, minLength: 1, maxLength: 2048}
        policy_version: {type: string, minLength: 1, maxLength: 2048}
        environment: {type: string, minLength: 1, maxLength: 2048}
        risk: {$ref: '#/components/schemas/RiskLevel'}
        review_context: {$ref: '#/components/schemas/ApprovalReviewContext'}
        risk_package_ref: {$ref: '#/components/schemas/EvidenceReference'}
        risk_package_digest: {$ref: '#/components/schemas/Digest'}
        state_snapshot_ref: {$ref: '#/components/schemas/EvidenceReference'}
        state_snapshot_digest: {$ref: '#/components/schemas/Digest'}
    ApprovalReviewEvidenceIssueRequest:
      description: >-
        Strict adapter input that produces an AUTHENTICATED_EVENT
        APPROVAL_REVIEW_PREPARED request for the existing Evidence Authority. It never accepts a
        private key and cannot sign a receipt.
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - idempotency_key
        - actor_subject
        - source_service
        - trace_id
        - material
        - requested_at
      properties:
        schema_version: {type: string, const: agenttrust.approval-review-evidence-issue.v2}
        request_id: {$ref: '#/components/schemas/Uuid'}
        idempotency_key: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
        actor_subject: {type: string, pattern: '^[A-Za-z0-9._:/@-]{1,512}$'}
        source_service: {type: string, pattern: '^(DNS|URI):[A-Za-z0-9._:/@-]{1,252}$'}
        trace_id: {type: string, pattern: '^[A-Za-z0-9._:/@-]{1,256}$'}
        material: {$ref: '#/components/schemas/ApprovalReviewMaterial'}
        requested_at: {$ref: '#/components/schemas/DateTime'}
    ApprovalReviewEvidence:
      description: >-
        Exact review material plus the complete request and shared signed receipt returned by
        POST /v1/evidence/authority-events. Approval persists both request and receipt so it can
        recompute request_digest and reject any requester-authored substitution.
      type: object
      additionalProperties: false
      required: [schema_version, material, authority_request, receipt]
      properties:
        schema_version: {type: string, const: agenttrust.approval-review-evidence-binding.v1}
        material: {$ref: '#/components/schemas/ApprovalReviewMaterial'}
        authority_request: {$ref: '../evidence/authority-evidence-event-request.schema.json'}
        receipt: {$ref: '../evidence/signed-authority-evidence-receipt.schema.json'}
    EvidenceReference:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: '^(evidence://|urn:agenttrust:(evidence|ledger-evidence):)[^\s?#]+$'
    ApprovalCaseView:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - case_id
        - domain
        - safe_summary
        - action_hash
        - resource
        - resource_version
        - policy_version
        - risk
        - evidence_refs
        - status
      oneOf:
        - required: [coding_details]
          properties:
            domain: {const: CODING}
          not: {required: [industrial_details]}
        - required: [industrial_details]
          properties:
            domain: {const: INDUSTRIAL}
          not: {required: [coding_details]}
      properties:
        schema_version: { type: string, const: agenttrust.approval-case-view.v1 }
        case_id: { $ref: '#/components/schemas/Uuid' }
        domain: { type: string, enum: [CODING, INDUSTRIAL] }
        safe_summary: { type: string, minLength: 1, maxLength: 2000 }
        action_hash: { $ref: '#/components/schemas/Digest' }
        resource: { type: string, minLength: 1, maxLength: 2048 }
        resource_version: { type: string, minLength: 1, maxLength: 2048 }
        policy_version: { type: string, minLength: 1, maxLength: 2048 }
        risk: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        coding_details: {$ref: '#/components/schemas/CodingApprovalReviewDetails'}
        industrial_details: {$ref: '#/components/schemas/IndustrialApprovalReviewDetails'}
        evidence_refs:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: '^(evidence://|urn:agenttrust:(evidence|ledger-evidence):)[^\s?#]+$'
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED, REVOKED] }
    AuthoritativeApprovalPage:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - authoritative
        - tenant_id
        - resource
        - items
        - next_cursor
        - data_digest
      properties:
        schema_version: { type: string, const: agenttrust.authoritative-approval-page.v1 }
        authoritative: { type: boolean, const: true }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        resource:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_-]{0,99}$'
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ApprovalCaseView' }
        next_cursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 5462
              pattern: '^[A-Za-z0-9_-]+$'
            - type: 'null'
        data_digest:
          allOf:
            - $ref: '#/components/schemas/Digest'
          description: >-
            Lowercase SHA-256 of RFC 8785 JCS over the response object fields
            schema_version, authoritative, tenant_id, resource, items, and
            next_cursor, excluding data_digest itself.
    SignedApprovalPrincipalAssertion:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - tenant_id
        - subject
        - roles
        - owned_resources
        - strong_auth
        - issuer
        - audience
        - issued_at
        - expires_at
        - jti
        - request_digest
        - client_identity
        - scope
        - key_id
        - signature
      properties:
        schema_version: { type: string, const: agenttrust.signed-approval-principal-assertion.v1 }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        subject: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_.:/@-]+$' }
        roles:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_.:/@-]+$' }
        owned_resources:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 2048 }
        strong_auth: { type: boolean, const: true }
        issuer: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_.:/@-]+$' }
        audience: { type: string, minLength: 1, maxLength: 256 }
        issued_at: { $ref: '#/components/schemas/DateTime' }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        jti: { $ref: '#/components/schemas/Uuid' }
        request_digest: { $ref: '#/components/schemas/Digest' }
        client_identity: { type: string, minLength: 5, maxLength: 512, pattern: '^(DNS|URI):.+$' }
        scope:
          type: string
          enum: [approvals:request, approvals:decide, approvals:issue, approvals:revoke]
        key_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$' }
        signature: { type: string, pattern: '^[A-Za-z0-9_-]{86}$' }
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    ApprovalType:
      type: string
      enum: [ACTION, SCOPE, ESCALATION, DUAL, EMERGENCY]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, REVOKED, EXPIRED, CONSUMED, POST_REVIEW_REQUIRED]
    ApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - task_id
        - step_id
        - action_hash
        - plan_hash
        - parameter_hash
        - resource
        - resource_version
        - policy_version
        - environment
        - risk
        - review_context
        - review_evidence
        - requester_subject
        - agent_owner_subject
        - justification
        - requested_ttl_seconds
        - requested_uses
      properties:
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        task_id: { $ref: '#/components/schemas/Uuid' }
        step_id: { $ref: '#/components/schemas/Uuid' }
        action_hash: { $ref: '#/components/schemas/Digest' }
        plan_hash: { $ref: '#/components/schemas/Digest' }
        parameter_hash: { $ref: '#/components/schemas/Digest' }
        resource: { type: string, minLength: 1, maxLength: 2048 }
        resource_version: { type: string, minLength: 1, maxLength: 2048 }
        policy_version: { type: string, minLength: 1, maxLength: 2048 }
        environment: { type: string, minLength: 1, maxLength: 2048 }
        risk: { $ref: '#/components/schemas/RiskLevel' }
        review_context: { $ref: '#/components/schemas/ApprovalReviewContext' }
        review_evidence: { $ref: '#/components/schemas/ApprovalReviewEvidence' }
        requester_subject: { type: string, minLength: 1, maxLength: 256 }
        agent_owner_subject: { type: string, minLength: 1, maxLength: 256 }
        justification: { type: string, minLength: 1, maxLength: 4096 }
        requested_ttl_seconds: { type: integer, minimum: 1, maximum: 604800 }
        requested_uses: { type: integer, const: 1 }
    ApprovalPolicy:
      type: object
      additionalProperties: false
      required:
        - policy_id
        - policy_version
        - approval_type
        - minimum_approvers
        - required_roles
        - prohibit_requester
        - prohibit_agent_owner
        - require_resource_owner
        - maximum_ttl_seconds
        - maximum_uses
        - maximum_risk
      properties:
        policy_id: { type: string, minLength: 1, maxLength: 256 }
        policy_version: { type: string, minLength: 1, maxLength: 256 }
        approval_type: { $ref: '#/components/schemas/ApprovalType' }
        minimum_approvers: { type: integer, minimum: 1, maximum: 64 }
        required_roles:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
        prohibit_requester: { type: boolean }
        prohibit_agent_owner: { type: boolean }
        require_resource_owner: { type: boolean }
        maximum_ttl_seconds: { type: integer, minimum: 1, maximum: 604800 }
        maximum_uses: { type: integer, const: 1 }
        maximum_risk: { $ref: '#/components/schemas/RiskLevel' }
    ApprovalCaseCreateEnvelope:
      type: object
      additionalProperties: false
      required: [schema_version, request, policy]
      properties:
        schema_version: { type: string, const: agenttrust.approval-case-create.v2 }
        request: { $ref: '#/components/schemas/ApprovalRequest' }
        policy: { $ref: '#/components/schemas/ApprovalPolicy' }
    ApprovalDecisionRecord:
      type: object
      additionalProperties: false
      required: [approver_subject, roles, decision, reason, decided_at, strong_auth]
      properties:
        approver_subject: { type: string, minLength: 1, maxLength: 256 }
        roles:
          type: array
          uniqueItems: true
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 256 }
        decision: { type: string, enum: [APPROVE, REJECT, POST_REVIEWED] }
        reason: { type: string, minLength: 1, maxLength: 4096 }
        decided_at: { $ref: '#/components/schemas/DateTime' }
        strong_auth: { type: boolean, const: true }
    ApprovalCase:
      type: object
      additionalProperties: false
      required: [schema_version, case_id, request, policy, status, decisions, created_at, expires_at, post_review_due_at]
      properties:
        schema_version: { type: string, const: agenttrust.enterprise-approval-case.v2 }
        case_id: { $ref: '#/components/schemas/Uuid' }
        request: { $ref: '#/components/schemas/ApprovalRequest' }
        policy: { $ref: '#/components/schemas/ApprovalPolicy' }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        decisions:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/ApprovalDecisionRecord' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        post_review_due_at:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    ApprovalDecisionEnvelope:
      type: object
      additionalProperties: false
      required: [schema_version, decision, reason]
      properties:
        schema_version: { type: string, const: agenttrust.approval-decision.v1 }
        decision: { type: string, enum: [APPROVE, REJECT, POST_REVIEWED] }
        reason: { type: string, minLength: 1, maxLength: 4096 }
