syntax = "proto3";
package agenttrust.v1;

import "agenttrust/v1/contracts.proto";

message SubmitActionRequest { CanonicalAction action = 1; string idempotency_key = 2; }
message SubmitActionResponse { string action_id = 1; string task_id = 2; bool accepted = 3; }
message ActionRequest { string action_id = 1; }
message ActionResponse { string action_id = 1; string task_id = 2; string status = 3; }
message TaskEventRequest { string task_id = 1; }
message TaskEvent { string event_id = 1; string event_type = 2; bytes payload_ref = 3; }

service AgentGateway {
  rpc SubmitAction(SubmitActionRequest) returns (SubmitActionResponse);
  rpc GetAction(ActionRequest) returns (ActionResponse);
  rpc CancelAction(ActionRequest) returns (ActionResponse);
  rpc KillAction(ActionRequest) returns (ActionResponse);
  rpc StreamTaskEvents(TaskEventRequest) returns (stream TaskEvent);
}

